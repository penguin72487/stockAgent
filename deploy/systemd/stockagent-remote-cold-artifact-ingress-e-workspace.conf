[Unit]
Requires=stockagent-e-workspace-mount.service
After=stockagent-e-workspace-mount.service

[Service]
# Retain private control receipts on C; stage completed remote payloads on E.
Environment="COLD_ARTIFACT_INGRESS_STAGING_ROOT=/srv/stockagent-workspace/restore/completed-return-staging"
# Reclaim only old, unreferenced package download caches on the remote node.
Environment="STOCKAGENT_REMOTE_CACHE_PRESSURE_GC=1"
