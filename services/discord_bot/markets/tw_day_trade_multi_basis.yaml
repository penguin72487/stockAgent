market: tw_day_trade_multi_basis
label: 台股・Multi-Basis 當沖（初始 1,000 萬）
# Keep this as an independent TWD 10 million deployment alongside the TWD
# 100 million and Projection-L1 GELU modes.  The checkpoint, immutable
# deployment config, model-scoped live output, and paper ledger are separate.
enabled: true
market_type: tw
timezone: Asia/Taipei
open_time: "09:00"
close_time: "13:30"
schedule_time: "09:00"
preopen_prepare_time: "08:15"
summary_time: "14:00"
data_ready_time: "13:40"
freshness_max_lag_days: 3
freshness_scan_limit: 0
holidays: []
initial_capital: 10000000.0
day_trade_simulation_enabled: true
day_trade_simulation_state_dir: artifacts/live/tw_day_trade_simulation
day_trade_rule_data_dir: /srv/stockagent-live/data_tw_public
day_trade_quote_interval_seconds: 60

# This model shares the canonical TW public data layer with the other modes.
# 09:00 starts the live signal; execution uses the first strictly later best
# Ask/Bid. Missing causal quotes fail closed without +1 Tick. Historical replay
# alone is recorded at 09:01: sizing uses the official 09:00 open and execution
# uses the observed right-labelled 09:01 minute VWAP.
pre_signal_command:
  - scripts/activate_tw_public_opening_data.py
  - --link
  - data_tw_public
pre_signal_timeout_seconds: 120
# Closed-market manual inference has a separate contract: rebuild the latest
# completed official close, but do not require tomorrow's eligibility or MIS.
completed_session_command:
  - scripts/finalize_tw_public_completed_session.py
completed_session_timeout_seconds: 600
formal_history_timeout_seconds: 1800
previous_signal_backfill_limit: 512

model_selection_path: ../models/tw_day_trade_multi_basis.yaml
config_path: configs/deployments/tw_day_trade_multi_basis_fold11.yaml
output_dir: artifacts/markets/tw_public_candles_multi_basis_online_complete_raw_feature_input_lookback32_v5
live_output_dir: artifacts/live_signals
fold_id: 11
checkpoint_path: artifacts/markets/tw_public_candles_multi_basis_online_complete_raw_feature_input_lookback32_v5/fold_11/checkpoint_best.pt
weights_path: artifacts/markets/tw_public_candles_multi_basis_online_complete_raw_feature_input_lookback32_v5/fold_11/daily_weights.parquet

panel_date: latest
device: cuda
price_source: panel
yahoo_chunk_size: 200
top_n: 2400
min_abs_delta: 0.001
benchmark_window_days: 32
max_turnover_warning: 1.5
max_top_weight_warning: 0.1
max_gross_warning: 1.05
unsupported_message: "**台股・Multi-Basis 當沖（初始 1,000 萬）** 模型尚未準備完成。"
