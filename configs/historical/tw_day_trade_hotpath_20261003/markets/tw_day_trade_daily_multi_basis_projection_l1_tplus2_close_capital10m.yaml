base_config: tw_day_trade_daily_multi_basis_tplus2_close_capital10m.yaml

# Formal market training run, not an ablation. Changing L1 normalization to an
# L1-ball projection changes the model/loss checkpoint contract, so it owns a
# fresh artifact root and must not resume the ordinary multi-basis L1 weights.
experiment_name: tw-day-trade-daily-multi-basis-projection-l1-tplus2-close-commission20-capital10m-panel-history-v2

runner:
  output_dir: artifacts/markets/tw_day_trade_daily_multi_basis_projection_l1_tplus2_close_commission20_capital10m_panel_history_v2
  resume: true
  post_train_infer: false

walk_forward:
  # Every validation/test year owns its first target. Its lookback may use only
  # already-observed rows from the preceding panel history.
  lookback_context: panel_history

trading:
  portfolio_activation: pre_normalized

training:
  # Persist every epoch and refresh train_*/epoch_curve_every1.png during the
  # fold instead of deferring the first render until training has completed.
  record_epoch_curve: true
  curve_plot_interval: 1
  curve_plot_async: true
  defer_epoch_curve_plot_until_end: false
  loss_portfolio_activation: pre_normalized
  financial_transformer:
    portfolio_output_mode: projection_l1
