base_config: tw_day_trade_daily_multi_basis_projection_l1_tplus2_close_capital10m.yaml

# All 18 existing temporal families plus Kautz, Discrete Hermite, Chirplet,
# and fold-training-only PCA/KLT. Each family starts from its unlimited
# lookback-32 pool and keeps only novelty>=1e-4 directions. This changes the
# input/checkpoint contract and therefore owns a fresh artifact root.
experiment_name: tw-day-trade-daily-multi-basis-22-effective-rank-projection-l1-tplus2-close-commission20-capital10m-v1

runner:
  output_dir: artifacts/markets/tw_day_trade_daily_multi_basis_22_effective_rank_projection_l1_tplus2_close_commission20_capital10m_v1
  resume: true
  post_train_infer: false

training:
  # 524 retained per-family components versus 72 in the old 18x4 run. Reduce
  # the global DDP batch by 8x so the family coefficient autograd tensors stay
  # within the dual-RTX-5090 memory envelope. The runner still owns OOM retry.
  batch_size_train: 16
  batch_size_eval: 16

  transformer_base_portfolio:
    temporal_basis_families:
      - haar
      - swt_db2
      - swt_sym4
      - wavelet_packet
      - walsh
      - fourier
      - dct
      - dpss
      - local_cosine
      - morlet
      - exponential
      - laguerre
      - difference
      - ar_innovation
      - bspline
      - legendre
      - chebyshev
      - learned
      - kautz
      - discrete_hermite
      - chirplet
      - pca_klt

    # Fallback for an unlisted future family. Every active family below has an
    # explicit limit obtained from its complete lookback-32 candidate pool.
    temporal_basis_components: 31
    temporal_basis_novelty_threshold: 0.0001
    temporal_basis_components_by_family:
      haar: 31
      swt_db2: 13
      swt_sym4: 10
      wavelet_packet: 14
      walsh: 31
      fourier: 31
      dct: 31
      dpss: 31
      local_cosine: 31
      morlet: 27
      exponential: 8
      laguerre: 13
      difference: 31
      ar_innovation: 8
      bspline: 30
      legendre: 31
      chebyshev: 31
      learned: 31
      kautz: 23
      discrete_hermite: 16
      chirplet: 21
      pca_klt: 31
