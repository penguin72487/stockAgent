state_dir: /root/stockAgent/artifacts/gpu_jobs/tw_futures_margin_components_20261003
jobs:
  - name: futures-margin-components-smoke
    enabled: true
    config: /root/stockAgent/configs/markets/tw_futures_v8_margin_components_capital100m_20261003.yaml
    gpus: [0, 1]
    fold_range: [10, 10]
    output_dir: /root/stockAgent/artifacts/markets/tw_futures_v8_margin_components_smoke_fold10_20261003
    extra_args:
      - --epochs
      - '4'
      - --resume
      - --early-stopping-no-improve-ratio
