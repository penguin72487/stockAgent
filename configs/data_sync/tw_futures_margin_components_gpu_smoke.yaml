      STOCKAGENT_CODE_RELEASE_RECEIPT: /root/stockAgent/artifacts/runtime/tw_futures_margin/code-release/release.json
      PYTHONUNBUFFERED: '1'
      POLARS_MAX_THREADS: '16'
      MPLBACKEND: Agg
