base_config: configs/markets/tw_futures_universe725_recovery_20261025_v1.yaml
output_root: artifacts/markets/tw_futures_universe725_recovery_20261025_v1
fold_selection: last
runtime:
  parallel_jobs: 1
  cpu_threads: 8
  torch_compile_threads: 8
  capacity_retry:
    max_retries: 2
    minimum_train_batch: 32
postprocess_plots:
  - split: val
    prefix: val
    comparison_mode: absolute
    scope_label: Historical recovery research; validation-only checkpoint selection
  - split: test
    prefix: test
    comparison_mode: absolute
    scope_label: Previously inspected research period; not an untouched holdout
matrix:
  mode: one_factor_at_a_time
  include_baseline: false
  fixed_overrides:
    training:
      epochs: 1000
      early_stopping_no_improve_ratio: 0.1
      early_stopping_min_delta: 0.0001
      pretrained_initialization_root: null
      warm_start_from_previous_fold: false
      loss_type: log_utility
    runner:
      resume: false
      require_cuda: true
  dimensions:
    - name: twd_equity
      enabled: true
      variants:
        - name: recovered_previous_0845_30m
          description: 補回歷史契約＋原前日容量／Recovered history with previous-session order capacity；08:45；30分鐘。
          overrides: {}
        - name: recovered_probe_0845_30m
          description: 因果一口探單／Causal one-contract probe；08:45；30分鐘；成交仍受實際窗口量50%及整口限制。
          overrides:
            trading:
              tw_futures_portfolio_entry_capacity_policy: single_contract_probe
        - name: recovered_probe_0845_300m
          description: 預先承諾等待成交／Precommitted extended execution window；08:45；300分鐘；不刷新盤中特徵。
          overrides:
            trading: &probe0845long
              tw_futures_portfolio_entry_capacity_policy: single_contract_probe
              tw_futures_portfolio_entry_clock_path: data_tw_index_futures/training_prepared/tw_futures_universe725_recovery_20261025_v1/source_v218/twd_equity/clocks/entry_window_300m/0845/entries.parquet
              tw_futures_portfolio_opening_reference_path: data_tw_index_futures/training_prepared/tw_futures_universe725_recovery_20261025_v1/source_v218/twd_equity/clocks/entry_window_300m/0845/opening_reference.parquet
        - name: recovered_fullprint_0845_300m
          description: 全成交量參與敏感度／Full observed-volume participation sensitivity；08:45；300分鐘；研究成交上界，不是保證實盤成交。
          overrides:
            trading:
              <<: *probe0845long
              max_volume_participation: 1.0
        - name: recovered_previous_0900_30m
          description: 補回歷史契約＋原前日容量／Recovered history with previous-session order capacity；09:00；相同歷史資訊。
          overrides:
            trading: &previous0900
              tw_futures_portfolio_decision_time: '09:00'
              tw_futures_portfolio_entry_clock_path: data_tw_index_futures/training_prepared/tw_futures_universe725_recovery_20261025_v1/source_v218/twd_equity/clocks/0900/entries.parquet
              tw_futures_portfolio_opening_reference_path: data_tw_index_futures/training_prepared/tw_futures_universe725_recovery_20261025_v1/source_v218/twd_equity/clocks/0900/opening_reference.parquet
        - name: recovered_probe_0900_30m
          description: 因果一口探單／Causal one-contract probe；09:00；30分鐘；不把零成交補成成交。
          overrides:
            trading:
              <<: *previous0900
              tw_futures_portfolio_entry_capacity_policy: single_contract_probe
        - name: recovered_probe_0900_300m
          description: 預先承諾等待成交／Precommitted extended execution window；09:00；300分鐘；原帳務與費率。
          overrides:
            trading: &probe0900long
              tw_futures_portfolio_decision_time: '09:00'
              tw_futures_portfolio_entry_capacity_policy: single_contract_probe
              tw_futures_portfolio_entry_clock_path: data_tw_index_futures/training_prepared/tw_futures_universe725_recovery_20261025_v1/source_v218/twd_equity/clocks/entry_window_300m/0900/entries.parquet
              tw_futures_portfolio_opening_reference_path: data_tw_index_futures/training_prepared/tw_futures_universe725_recovery_20261025_v1/source_v218/twd_equity/clocks/entry_window_300m/0900/opening_reference.parquet
        - name: recovered_fullprint_0900_300m
          description: 全成交量參與敏感度／Full observed-volume participation sensitivity；09:00；300分鐘；保留滑價與深度尚未驗證的限制。
          overrides:
            trading:
              <<: *probe0900long
              max_volume_participation: 1.0
