base_config: configs/markets/tw_futures_residual_signals_20261027_v1.yaml
output_root: artifacts/markets/tw_futures_residual_signals_20261027_v1
fold_selection: last
runtime:
  parallel_jobs: 1
  cpu_threads: 8
  torch_compile_threads: 8
  capacity_retry:
    max_retries: 2
    minimum_train_batch: 32
postprocess_plots:
  - split: val
    prefix: val
    comparison_mode: absolute
    scope_label: Validation-only checkpoint selection; prior-only residual signals
  - split: test
    prefix: test
    comparison_mode: absolute
    scope_label: Previously inspected research period; not an untouched holdout
matrix:
  mode: one_factor_at_a_time
  include_baseline: false
  fixed_overrides:
    training:
      epochs: 1000
      early_stopping_no_improve_ratio: 0.1
      early_stopping_min_delta: 0.0001
      pretrained_initialization_root: null
      warm_start_from_previous_fold: false
      loss_type: log_utility
      optimizer_name: muon
      optimizer_options:
        matrix_lr_scale: 1.0
        aux_lr_scale: 1.0
        adjust_lr_fn: match_rms_adamw
    runner:
      resume: false
      require_cuda: true
  dimensions:
    - name: twd_equity
      enabled: true
      variants:
        - name: control_0845
          description: 自由策略對照／Unconstrained policy control；08:45；Muon；2011起。
          overrides: {}
        - name: signal_0845
          description: 因果殘差訊號／Causal residual signals；08:45；由神經網路學習訊號與曝險。
          overrides:
            training:
              financial_transformer:
                futures_residual_signal_context: true
        - name: signal_beta0_0845
          description: 因果殘差訊號＋先驗beta中性／Causal residual signals with prior beta neutrality；08:45。
          overrides:
            training:
              financial_transformer:
                futures_residual_signal_context: true
                futures_beta_notional_cap: 0.0
        - name: control_0900
          description: 自由策略對照／Unconstrained policy control；09:00；相同歷史資訊。
          overrides: &clock0900
            trading:
              tw_futures_portfolio_decision_time: '09:00'
              tw_futures_portfolio_entry_clock_path: data_tw_index_futures/training_prepared/tw_futures_historical_universe_20261025_v3/twd_equity/clocks/0900/entries.parquet
              tw_futures_portfolio_opening_reference_path: data_tw_index_futures/training_prepared/tw_futures_historical_universe_20261025_v3/twd_equity/clocks/0900/opening_reference.parquet
        - name: signal_0900
          description: 因果殘差訊號／Causal residual signals；09:00；相同歷史資訊。
          overrides:
            <<: *clock0900
            training:
              financial_transformer:
                futures_residual_signal_context: true
        - name: signal_beta0_0900
          description: 因果殘差訊號＋先驗beta中性／Causal residual signals with prior beta neutrality；09:00。
          overrides:
            <<: *clock0900
            training:
              financial_transformer:
                futures_residual_signal_context: true
                futures_beta_notional_cap: 0.0
