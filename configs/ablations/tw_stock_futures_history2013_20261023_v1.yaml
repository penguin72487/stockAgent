# Six from-scratch cases; two same-period controls precede four candidates.
# A separate research horizon, not acceptance or replacement of the 2011 run.
base_config: configs/markets/tw_stock_futures_carry_0845_history2013_20261023_v1.yaml
output_root: artifacts/markets/tw_stock_futures_history2013_20261023_v1
fold_selection: last
runtime:
  parallel_jobs: 1
  cpu_threads: 8
  torch_compile_threads: 8
  capacity_retry:
    max_retries: 2
    minimum_train_batch: 32
postprocess_plots:
  - split: val
    prefix: val
    comparison_mode: absolute
    scope_label: 2013-start paired-clock research; validation-only selection
  - split: test
    prefix: test
    comparison_mode: absolute
    scope_label: Previously inspected latest-period research; not an untouched holdout
matrix:
  mode: one_factor_at_a_time
  include_baseline: false
  fixed_overrides:
    training:
      epochs: 1000
      early_stopping_no_improve_ratio: 0.1
      early_stopping_min_delta: 0.0001
      pretrained_initialization_root: null
      warm_start_from_previous_fold: false
    runner:
      resume: false
      require_cuda: true
  dimensions:
    - name: clock
      enabled: true
      variants:
        - name: '0845'
          description: '2013起基準／2013-start control；08:45，完整原帳務，從零訓練。'
          overrides: {}
        - name: '0900'
          description: '2013起基準／2013-start control；09:00，相同前一交易日股票資訊。'
          overrides:
            trading:
              tw_futures_portfolio_decision_time: '09:00'
              tw_futures_portfolio_entry_clock_path: artifacts/data_preparation/tw_stock_futures_history2013_20261023_v1/clocks/0900/entries.parquet
              tw_futures_portfolio_opening_reference_path: artifacts/data_preparation/tw_stock_futures_history2013_20261023_v1/clocks/0900/opening_reference.parquet
    - name: clock0845
      enabled: true
      variants:
        - name: notional
          description: '名目本金座標／Notional-coordinate policy；調整 IM/notional 梯度尺度。'
          overrides:
            training:
              financial_transformer:
                futures_notional_score_coordinates: true
        - name: muon
          description: '隱藏矩陣正交更新／Muon hidden matrices；其餘角色維持 AdamW。'
          overrides:
            training:
              optimizer_name: muon
              optimizer_options:
                matrix_lr_scale: 1.0
                aux_lr_scale: 1.0
                adjust_lr_fn: match_rms_adamw
    - name: clock0900
      enabled: true
      variants:
        - name: notional
          description: '名目本金座標／Notional-coordinate policy；09:00。'
          overrides:
            trading:
              tw_futures_portfolio_decision_time: '09:00'
              tw_futures_portfolio_entry_clock_path: artifacts/data_preparation/tw_stock_futures_history2013_20261023_v1/clocks/0900/entries.parquet
              tw_futures_portfolio_opening_reference_path: artifacts/data_preparation/tw_stock_futures_history2013_20261023_v1/clocks/0900/opening_reference.parquet
            training:
              financial_transformer:
                futures_notional_score_coordinates: true
        - name: muon
          description: '隱藏矩陣正交更新／Muon hidden matrices；09:00。'
          overrides:
            trading:
              tw_futures_portfolio_decision_time: '09:00'
              tw_futures_portfolio_entry_clock_path: artifacts/data_preparation/tw_stock_futures_history2013_20261023_v1/clocks/0900/entries.parquet
              tw_futures_portfolio_opening_reference_path: artifacts/data_preparation/tw_stock_futures_history2013_20261023_v1/clocks/0900/opening_reference.parquet
            training:
              optimizer_name: muon
              optimizer_options:
                matrix_lr_scale: 1.0
                aux_lr_scale: 1.0
                adjust_lr_fn: match_rms_adamw
