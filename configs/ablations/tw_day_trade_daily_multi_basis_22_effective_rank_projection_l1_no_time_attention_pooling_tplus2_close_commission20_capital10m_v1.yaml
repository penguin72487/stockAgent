# Self-contained 22-family effective-rank OFAT.  The first queued experiment is
# the no-learned-time-position + attention-pooling baseline; every following
# experiment changes one factor relative to that control.  The supervisor runs
# all 20 experiments sequentially and refreshes comparison plots after each one.
base_spec: tw_day_trade_daily_multi_basis_projection_l1_tplus2_close_commission20_v1.yaml
base_config: configs/markets/tw_day_trade_daily_multi_basis_22_effective_rank_projection_l1_no_time_attention_pooling_tplus2_close_capital10m.yaml
output_root: artifacts/ablations/tw_day_trade_daily_multi_basis_22_effective_rank_projection_l1_no_time_attention_pooling_tplus2_close_commission20_capital10m_v1_ofat

# Freeze every experiment to the panel generation already built from the
# active immutable 2026-08-20 tw-public snapshot.  Model/basis changes do not
# alter this panel contract.
pinned_panel_cache:
  snapshot_id: tw-public-20260820T015018219623218Z-l0-penguin-6716296ea30636ba
  variant_id: c8b02a7a891549c4108c0307a8db47cdc34f17e9b17aa75afbdd79089c1748ac
  version: 51
  generation: 67458178ae924a0188d98841e9b17229
  source_hash: 31f3e4f1e31338bb9c0fd52494cc0d840a5081ffeab00a1fceddfa3412258fe0

batch_policy:
  default_global_train_batch: 16
  attention_pooling_global_train_batch: 16
  oom_fallback_order: [16, 8, 4, 2]
  resolved_experiment_batches:
    lookback128_batch256: 4
    mean_pooling: 16
    attention_pooling: 16

matrix:
  # The inherited suite already fixes T+2 close execution, 20% commission,
  # TWD 10M capital, 1000 epochs, panel-history windows, projection-L1 output,
  # include_baseline=true, and sequential all-GPU DDP execution.
  base_overrides:
    training:
      batch_size_train: 16
      batch_size_eval: 16

  experiment_overrides:
    # Lookback 128 retains four times as many temporal activations as the
    # lookback-32 attention-pooling control.  Keep the same 22 family caps and
    # use a conservative 4-row global batch.
    lookback128_batch256:
      experiment_name: lookback128_batch4
      description: Lookback 128 at global train/eval batch 4.
      overrides:
        training:
          lookback: 128
          batch_size_train: 4
          batch_size_eval: 4
          eval_model_chunk_rows: 4
          eval_auto_chunk_rows_cap: 4

    # The inherited no-time variant would duplicate this suite's control, so
    # reverse it into the one-factor learned-time-position comparison.
    no_time_position:
      experiment_name: with_time_position
      description: Enable learned temporal-position embeddings.
      overrides:
        training:
          financial_transformer:
            use_time_pos: true

    mean_pooling:
      overrides:
        training:
          batch_size_train: 16

    # Attention pooling is now the control.  Reuse the inherited row as the
    # one-factor last-token pooling comparison and pair it with last_only.
    attention_pooling:
      experiment_name: last_pooling
      description: Replace attention pooling with last-token pooling.
      overrides:
        training:
          batch_size_train: 16
          financial_transformer:
            temporal_pooling: last
            temporal_query_mode: last_only
