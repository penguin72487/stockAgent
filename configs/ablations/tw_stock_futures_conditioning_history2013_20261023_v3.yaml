base_config: ../markets/tw_stock_futures_carry_0845_history2013_20261023_v2.yaml
output_root: artifacts/markets/tw_stock_futures_conditioning_history2013_20261023_v3
fold_selection: last
runtime:
  parallel_jobs: 1
  cpu_threads: 8
  torch_compile_threads: 8
  capacity_retry:
    max_retries: 2
    minimum_train_batch: 32
matrix:
  mode: one_factor_at_a_time
  include_baseline: false
  fixed_overrides:
    training:
      epochs: 1000
      early_stopping_no_improve_ratio: 0.1
      early_stopping_min_delta: 0.0001
      pretrained_initialization_root: null
      warm_start_from_previous_fold: false
    runner:
      require_cuda: true
      resume: false
  dimensions:
    - name: clock0845
      enabled: true
      variants:
        - name: adamw_lr3e5
          description: 較大步長／Larger AdamW step；08:45，辨識有效更新幅度。
          overrides:
            training:
              learning_rate: 0.00003
        - name: notional_muon
          description: 名目座標與正交更新／Notional coordinates + Muon；08:45，檢查交互作用。
          overrides:
            training:
              financial_transformer:
                futures_notional_score_coordinates: true
              optimizer_name: muon
              optimizer_options:
                matrix_lr_scale: 1.0
                aux_lr_scale: 1.0
                adjust_lr_fn: match_rms_adamw
    - name: clock0900
      enabled: true
      variants:
        - name: adamw_lr3e5
          description: 較大步長／Larger AdamW step；09:00，相同歷史股票資訊。
          overrides:
            trading:
              tw_futures_portfolio_decision_time: '09:00'
              tw_futures_portfolio_entry_clock_path: data_tw_index_futures/training_prepared/tw_stock_futures_history2013_20261023_v1/clocks/0900/entries.parquet
              tw_futures_portfolio_opening_reference_path: data_tw_index_futures/training_prepared/tw_stock_futures_history2013_20261023_v1/clocks/0900/opening_reference.parquet
            training:
              learning_rate: 0.00003
        - name: notional_muon
          description: 名目座標與正交更新／Notional coordinates + Muon；09:00。
          overrides:
            trading:
              tw_futures_portfolio_decision_time: '09:00'
              tw_futures_portfolio_entry_clock_path: data_tw_index_futures/training_prepared/tw_stock_futures_history2013_20261023_v1/clocks/0900/entries.parquet
              tw_futures_portfolio_opening_reference_path: data_tw_index_futures/training_prepared/tw_stock_futures_history2013_20261023_v1/clocks/0900/opening_reference.parquet
            training:
              financial_transformer:
                futures_notional_score_coordinates: true
              optimizer_name: muon
              optimizer_options:
                matrix_lr_scale: 1.0
                aux_lr_scale: 1.0
                adjust_lr_fn: match_rms_adamw
