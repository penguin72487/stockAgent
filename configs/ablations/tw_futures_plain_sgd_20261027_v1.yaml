base_config: configs/markets/tw_futures_plain_sgd_20261027_v1.yaml
output_root: artifacts/markets/tw_futures_plain_sgd_20261027_v1
fold_selection: last
runtime:
  parallel_jobs: 1
  cpu_threads: 8
  torch_compile_threads: 8
  capacity_retry:
    max_retries: 2
    minimum_train_batch: 32
postprocess_plots:
  - split: val
    prefix: val
    comparison_mode: absolute
    scope_label: Validation-only selection; plain SGD with simple fee-net log utility
  - split: test
    prefix: test
    comparison_mode: absolute
    scope_label: Previously inspected research period; not an untouched holdout
matrix:
  mode: one_factor_at_a_time
  include_baseline: false
  fixed_overrides:
    training:
      epochs: 1000
      early_stopping_no_improve_ratio: 0.1
      early_stopping_min_delta: 0.0001
      pretrained_initialization_root: null
      warm_start_from_previous_fold: false
    runner:
      resume: false
      require_cuda: true
  dimensions:
    - name: twd_equity
      enabled: true
      variants:
        - name: sgd_0845
          description: 無動量SGD殘差策略／Plain-SGD residual policy；08:45；單一log utility，並非MGDA。
          overrides: {}
        - name: sgd_0900
          description: 無動量SGD殘差策略／Plain-SGD residual policy；09:00；相同歷史訊號與帳務。
          overrides:
            trading:
              tw_futures_portfolio_decision_time: '09:00'
              tw_futures_portfolio_entry_clock_path: data_tw_index_futures/training_prepared/tw_futures_historical_universe_20261025_v3/twd_equity/clocks/0900/entries.parquet
              tw_futures_portfolio_opening_reference_path: data_tw_index_futures/training_prepared/tw_futures_historical_universe_20261025_v3/twd_equity/clocks/0900/opening_reference.parquet
