# Self-contained OFAT for the multi-basis projection_l1 model. One invocation
# trains the baseline first and then every true variant in the same sequential
# queue; no external formal baseline is required or linked.
base_spec: tw_day_trade_daily_tplus2_close_commission20_v3_mixed_batch.yaml
base_config: configs/markets/tw_day_trade_daily_multi_basis_projection_l1_tplus2_close_capital10m.yaml
output_root: artifacts/ablations/tw_day_trade_daily_multi_basis_projection_l1_tplus2_close_commission20_panel_history_v3_ofat_capital10m

# Freeze the exact panel generation used by the formal baseline. The active
# data_tw_public symlink may advance while this multi-day experiment runs.
pinned_panel_cache:
  snapshot_id: tw-public-20260818T004438951872136Z-l0-penguin-03232cac51756cb4
  variant_id: dffa1e873a46390f68a60efa5e30e8f2a5d0c3546d1a6aeed5d52215e3de2448
  version: 51
  generation: a49777df44f241b29c87d36f89504406
  source_hash: 7aa93ac5d97fa96bdfec042750edc28d68ab5129afa748dbf83a7df81f119464

batch_policy:
  default_global_train_batch: 128
  attention_pooling_global_train_batch: 128
  oom_fallback_order: [128, 64, 32, 16]
  resolved_experiment_batches:
    # The inherited source row is renamed below. Its old batch 256 setting was
    # never feasible for this projection_l1 multi-basis model: fold 1 only used
    # 120 available rows, while fold 2 reached the real 256-row shape and OOMed
    # on both 31.36-GiB RTX 5090 ranks.
    lookback128_batch256: 128
    lookback128_batch128: 128
    mean_pooling: 128
    attention_pooling: 128

matrix:
  # The runner preserves declaration order and parallel_jobs=1, so baseline
  # must complete before the 19 true variants begin.
  include_baseline: true
  base_overrides:
    walk_forward:
      lookback_context: panel_history
    training:
      batch_size_train: 128
      batch_size_eval: 128

  # Patch only the inherited high-lookback row instead of duplicating all 19
  # OFAT dimensions. The fresh name prevents the incompatible partial
  # lookback128_batch256 checkpoint/artifacts from being resumed or mixed.
  experiment_overrides:
    lookback128_batch256:
      experiment_name: lookback128_batch128
      description: Lookback 128 at the baseline global train batch 128.
      overrides:
        training:
          lookback: 128
          batch_size_train: 128
    # financial_transformer uses `input_features` temporal basis decomposition,
    # which requires RMSNorm; use the RMSNorm-safe temporal-basis path for this
    # variant so the `layernorm` ablation can run without dropping into an
    # architectural exception state.
    layernorm:
      overrides:
        training:
          transformer_base_portfolio:
            temporal_basis_input: raw_features
          financial_transformer:
            temporal_basis_input: raw_features
