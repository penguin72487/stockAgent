base_config: configs/markets/tw_futures_dated_membership_20261025_v1.yaml
output_root: artifacts/markets/tw_futures_dated_membership_20261025_v1
fold_selection: last
runtime:
  parallel_jobs: 1
  cpu_threads: 8
  torch_compile_threads: 8
  capacity_retry:
    max_retries: 2
    minimum_train_batch: 32
postprocess_plots:
  - split: val
    prefix: val
    comparison_mode: absolute
    scope_label: Dated membership; validation-only checkpoint selection
  - split: test
    prefix: test
    comparison_mode: absolute
    scope_label: Previously inspected research period; not an untouched holdout
matrix:
  mode: one_factor_at_a_time
  include_baseline: false
  fixed_overrides:
    training:
      epochs: 1000
      early_stopping_no_improve_ratio: 0.1
      early_stopping_min_delta: 0.0001
      pretrained_initialization_root: null
      warm_start_from_previous_fold: false
      loss_type: log_utility
    runner:
      resume: false
      require_cuda: true
  dimensions:
    - name: twd_equity
      enabled: true
      variants:
        - name: union_beta0_0845_30m
          description: 逐日商品集合＋先驗beta中性／Dated universe with prior beta neutrality；08:45；Muon；30分鐘成交窗口。
          overrides:
            training:
              financial_transformer:
                futures_beta_notional_cap: 0.0
        - name: union_beta025_0845_30m
          description: 逐日商品集合＋有限beta／Dated universe with bounded prior beta；08:45；Muon；beta名目曝險上限NAV的25%。
          overrides: {}
        - name: union_beta0_0900_30m
          description: 逐日商品集合＋先驗beta中性／Dated universe with prior beta neutrality；09:00；Muon；30分鐘成交窗口。
          overrides:
            trading: &clock0900
              tw_futures_portfolio_decision_time: '09:00'
              tw_futures_portfolio_entry_clock_path: data_tw_index_futures/training_prepared/tw_futures_historical_universe_20261025_v3/twd_equity/clocks/entry_window_30m/0900/entries.parquet
              tw_futures_portfolio_opening_reference_path: data_tw_index_futures/training_prepared/tw_futures_historical_universe_20261025_v3/twd_equity/clocks/entry_window_30m/0900/opening_reference.parquet
            training:
              financial_transformer:
                futures_beta_notional_cap: 0.0
        - name: union_beta025_0900_30m
          description: 逐日商品集合＋有限beta／Dated universe with bounded prior beta；09:00；Muon；相同歷史資訊。
          overrides:
            trading: *clock0900
