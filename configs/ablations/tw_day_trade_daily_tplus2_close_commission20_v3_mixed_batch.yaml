# Daily TW day-trade OFAT with per-experiment physical batch sizing.
#
# Batch size is intentionally not an invariant in this matrix. All ordinary
# last-query experiments start at global batch 512. The known high-memory
# full-history pooling experiments are fixed at their measured global batch
# 128 limit. A batch change alters the optimizer trajectory, so this policy
# owns a fresh artifact root and must never resume checkpoints from the
# uniform-batch OFAT root.
base_config: configs/markets/tw_day_trade_daily_no_default.yaml
output_root: artifacts/ablations/tw_day_trade_daily_tplus2_close_commission20_v4_ofat_mixed_batch_panel_history_capital10m
# This root deliberately does not reuse the historical TWD 1M market baseline.
# Initial capital affects whole-lot feasibility, the causal volume cap, loss,
# and the optimizer trajectory, so the TWD 10M baseline must be trained under
# the same fresh OFAT contract as every non-capital variant.
expected_fold_count: 12

# This suite began on the immutable 2026-08-04 public-data panel. Keep every
# resumed and not-yet-started fold on that exact cached generation even after
# the live data_tw_public symlink advances; mixing panel generations would make
# the OFAT comparison invalid and causes strict checkpoint fingerprints to fail.
pinned_panel_cache:
  snapshot_id: tw-public-20260804T083108590889195Z-l0-lab203-7e95d25803d82230
  variant_id: 75dc0b0a2b09ddb0eeaa783ca627e4ae04115c0f60ad7a7ea1762a084f6b171f
  version: 51
  generation: 0287b07e62da4030967877bd9b3e3bac
  source_hash: 59226dbf7b98ad626d0d4b8caef670b251b248d20d386c410413ae03ababff7f

batch_policy:
  default_global_train_batch: 512
  attention_pooling_global_train_batch: 128
  oom_fallback_order: [512, 256, 128, 64]
  resolved_experiment_batches:
    # Fold-12 compiled forward/backward: 512 OOM at 30.80 GiB/card;
    # 256 completed the canonical one-epoch preflight.
    lookback128_batch256: 256
    # full_then_last retains all temporal activations. Both 512 and 256 OOM;
    # 128 completed the canonical one-epoch preflight.
    mean_pooling: 128
    attention_pooling: 128

runtime:
  parallel_jobs: 1
  cpu_threads: 112
  torch_compile_threads: 16

matrix:
  mode: one_factor_at_a_time
  include_baseline: true
  fixed_overrides:
    data:
      panel_start_date: '2014-01-01'
      day_trade_minute_execution_root: null
    walk_forward:
      # A new calendar-year model owns its first target. Its feature window may
      # use only already-observed rows from prior panel history.
      lookback_context: panel_history
    trading:
      execution_mode: tw_day_trade
      frequency: daily
      long_only: false
      tw_short_capacity_limit_enabled: false
      tw_commission_discount: 0.2
      tw_commission_rebate_timing: daily_close
      tw_day_trade_unlimited_margin_conversion: true
      tw_day_trade_margin_financing_ratio: 0.6
      tw_day_trade_margin_financing_annual_rate: 0.16
      tw_day_trade_margin_short_handling_fee_rate: 0.001
      tw_day_trade_margin_short_annual_borrow_rate: 0.2
    training:
      model_name: financial_transformer
      epochs: 1000
      loss_type: log_utility
      auto_batch_size: false
      # Persist one loss row per epoch and refresh the full-resolution curve
      # while training.  The asynchronous plotter may coalesce overlapping
      # render requests, but every recorded epoch remains in the PNG series.
      record_epoch_curve: true
      curve_plot_interval: 1
      curve_plot_async: true
      defer_epoch_curve_plot_until_end: false
  base_overrides:
    runner:
      post_train_infer: false
    trading:
      # Canonical OFAT capital. Every non-capital ablation inherits TWD 10M;
      # only the explicit initial_capital dimension may change it.
      volume_participation_equity: 10000000.0
    training:
      batch_size_train: 512
      batch_size_eval: 128

  dimensions:
  - name: lookback_batch
    enabled: true
    paths:
    - training.lookback
    - training.batch_size_train
    baseline: [32, 512]
    values:
    - name: lookback128_batch256
      experiment_name: lookback128_batch256
      value: [128, 256]
      overrides:
        training:
          batch_size_eval: 32
          eval_model_chunk_rows: 32
          eval_auto_chunk_rows_cap: 32

  - name: information_bottleneck
    enabled: true
    baseline: [true, true]
    variants:
    - name: latent_only
      experiment_name: latent_only
      overrides:
        training:
          financial_transformer:
            use_latent_factors: true
            use_market_tokens: false
    - name: market_only
      experiment_name: market_only
      overrides:
        training:
          financial_transformer:
            use_latent_factors: false
            use_market_tokens: true
    - name: temporal_only
      experiment_name: temporal_only
      overrides:
        training:
          financial_transformer:
            use_latent_factors: false
            use_market_tokens: false

  - name: temporal_rope
    enabled: true
    path: training.financial_transformer.rope_temporal
    baseline: true
    values:
    - name: disabled
      experiment_name: no_rope_temporal
      value: false

  - name: learned_time_position
    enabled: true
    path: training.financial_transformer.use_time_pos
    baseline: true
    values:
    - name: disabled
      experiment_name: no_time_position
      value: false

  - name: learned_symbol_position
    enabled: true
    path: training.financial_transformer.use_symbol_pos
    baseline: false
    values:
    - name: enabled
      experiment_name: with_symbol_position
      value: true

  - name: qk_normalization
    enabled: true
    path: training.financial_transformer.qk_norm
    baseline: true
    values:
    - name: disabled
      experiment_name: no_qk_norm
      value: false

  - name: temporal_pooling
    enabled: true
    baseline: last
    variants:
    - name: mean
      experiment_name: mean_pooling
      overrides:
        training:
          batch_size_train: 128
          financial_transformer:
            temporal_pooling: mean
            temporal_query_mode: full_then_last
    - name: attention
      experiment_name: attention_pooling
      overrides:
        training:
          batch_size_train: 128
          financial_transformer:
            temporal_pooling: attention
            temporal_query_mode: full_then_last

  - name: normalization
    enabled: true
    path: training.financial_transformer.norm_type
    baseline: rmsnorm
    values:
    - name: layernorm
      experiment_name: layernorm
      value: layernorm

  - name: feed_forward
    enabled: true
    path: training.financial_transformer.ffn_type
    baseline: swiglu
    values:
    - name: gelu
      experiment_name: gelu_ffn
      value: gelu

  - name: initial_capital
    enabled: true
    # This is the absolute-equity anchor used by the exact whole-lot audit and
    # causal volume-participation cap. TWD 10M is the baseline; all other
    # capital levels are explicit OFAT variants.
    path: trading.volume_participation_equity
    baseline: 10000000.0
    values:
    - name: 1m
      experiment_name: initial_capital_1m
      value: 1000000.0
    - name: 100m
      experiment_name: initial_capital_100m
      value: 100000000.0

  - name: portfolio_output_mode
    enabled: true
    baseline: l1
    variants:
    - name: activation_l1
      experiment_name: output_activation_l1
      overrides:
        trading:
          portfolio_activation: identity
        training:
          loss_portfolio_activation: identity
          financial_transformer:
            portfolio_output_mode: activation_l1
    - name: logits
      experiment_name: output_logits
      overrides:
        trading:
          portfolio_activation: identity
        training:
          loss_portfolio_activation: identity
          financial_transformer:
            portfolio_output_mode: logits
    - name: signed_softmax
      experiment_name: output_signed_softmax
      overrides:
        training:
          financial_transformer:
            portfolio_output_mode: signed_softmax
    - name: signed_entmax15
      experiment_name: output_signed_entmax15
      overrides:
        training:
          financial_transformer:
            portfolio_output_mode: signed_entmax15
    - name: signed_sparsemax
      experiment_name: output_signed_sparsemax
      overrides:
        training:
          financial_transformer:
            portfolio_output_mode: signed_sparsemax
