base_config: configs/markets/tw_futures_historical_universe_20261025_v2.yaml
output_root: artifacts/markets/tw_futures_historical_universe_20261025_v2
fold_selection: last
runtime:
  parallel_jobs: 1
  cpu_threads: 8
  torch_compile_threads: 8
  capacity_retry:
    max_retries: 2
    minimum_train_batch: 32
postprocess_plots:
  - split: val
    prefix: val
    comparison_mode: absolute
    scope_label: Historical universe; validation-only checkpoint selection
  - split: test
    prefix: test
    comparison_mode: absolute
    scope_label: Previously inspected research period; not an untouched holdout
matrix:
  mode: one_factor_at_a_time
  include_baseline: false
  fixed_overrides:
    training:
      epochs: 1000
      early_stopping_no_improve_ratio: 0.1
      early_stopping_min_delta: 0.0001
      pretrained_initialization_root: null
      warm_start_from_previous_fold: false
      loss_type: log_utility
      optimizer_name: muon
      optimizer_options:
        matrix_lr_scale: 1.0
        aux_lr_scale: 1.0
        adjust_lr_fn: match_rms_adamw
    runner:
      resume: false
      require_cuda: true
  dimensions:
    - name: twd_equity
      enabled: true
      variants:
        - name: history_0845_1m
          description: 完整歷史商品／Historical universe；08:45；1分鐘成交窗口。
          overrides: {}
        - name: history_0900_1m
          description: 完整歷史商品／Historical universe；09:00；1分鐘成交窗口。
          overrides:
            trading:
              tw_futures_portfolio_decision_time: '09:00'
              tw_futures_portfolio_entry_clock_path: data_tw_index_futures/training_prepared/tw_futures_historical_universe_20261025_v2/twd_equity/clocks/0900/entries.parquet
              tw_futures_portfolio_opening_reference_path: data_tw_index_futures/training_prepared/tw_futures_historical_universe_20261025_v2/twd_equity/clocks/0900/opening_reference.parquet
        - name: history_0845_30m
          description: 完整歷史商品／Historical universe；08:45；30分鐘真實成交VWAP窗口。
          overrides:
            trading:
              tw_futures_portfolio_entry_clock_path: data_tw_index_futures/training_prepared/tw_futures_historical_universe_20261025_v2/twd_equity/clocks/entry_window_30m/0845/entries.parquet
              tw_futures_portfolio_opening_reference_path: data_tw_index_futures/training_prepared/tw_futures_historical_universe_20261025_v2/twd_equity/clocks/entry_window_30m/0845/opening_reference.parquet
        - name: history_0900_30m
          description: 完整歷史商品／Historical universe；09:00；30分鐘真實成交VWAP窗口。
          overrides:
            trading:
              tw_futures_portfolio_decision_time: '09:00'
              tw_futures_portfolio_entry_clock_path: data_tw_index_futures/training_prepared/tw_futures_historical_universe_20261025_v2/twd_equity/clocks/entry_window_30m/0900/entries.parquet
              tw_futures_portfolio_opening_reference_path: data_tw_index_futures/training_prepared/tw_futures_historical_universe_20261025_v2/twd_equity/clocks/entry_window_30m/0900/opening_reference.parquet
