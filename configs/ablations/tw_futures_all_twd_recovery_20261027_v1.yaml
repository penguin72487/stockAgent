              tw_futures_portfolio_entry_capacity_policy: single_contract_probe
        - name: clock0900__300m__single_contract_probe_p100
          description: 全口成交窗研究／Whole-contract observed-window research；09:00，300分鐘，單口試單與100%實際觀察成交量；不同於原50%容量對照。
          overrides:
            trading:
