base_config: configs/markets/tw_futures_all_twd_recovery_20261027_v1.yaml
output_root: artifacts/markets/tw_futures_all_twd_recovery_20261027_v1
fold_selection: last
runtime:
  parallel_jobs: 1
  cpu_threads: 8
  torch_compile_threads: 8
  capacity_retry:
    max_retries: 2
    minimum_train_batch: 32
postprocess_plots:
  - split: val
    prefix: val
    comparison_mode: absolute
    scope_label: Validation-only checkpoint selection; source-bound all-TWD research
  - split: test
    prefix: test
    comparison_mode: absolute
    scope_label: Previously inspected research period; not an untouched holdout
matrix:
  mode: one_factor_at_a_time
  include_baseline: false
  fixed_overrides:
    training:
      epochs: 1000
      early_stopping_no_improve_ratio: 0.1
      early_stopping_min_delta: 0.0001
      pretrained_initialization_root: null
      warm_start_from_previous_fold: false
      loss_type: log_utility
      optimizer_name: muon
      optimizer_options:
        matrix_lr_scale: 1.0
        aux_lr_scale: 1.0
        adjust_lr_fn: match_rms_adamw
    runner:
      resume: false
      require_cuda: true
  dimensions:
    - name: all_twd
      enabled: true
      variants:
        - name: clock0845__1m__previous_session
          description: 全台幣期貨原容量對照／All-TWD previous-session capacity control；08:45，1分鐘。
          overrides: {}
        - name: clock0845__300m__previous_session
          description: 預先承諾長成交窗／Precommitted execution window；08:45，300分鐘，原容量。
          overrides:
            trading:
              tw_futures_portfolio_entry_clock_path: data_tw_index_futures/training_prepared/tw_futures_universe765_20261027_v1/execution_all_twd_v8q/all_twd/clocks/entry_window_300m/0845/entries.parquet
              tw_futures_portfolio_opening_reference_path: data_tw_index_futures/training_prepared/tw_futures_universe765_20261027_v1/execution_all_twd_v8q/all_twd/clocks/entry_window_300m/0845/opening_reference.parquet
        - name: clock0845__300m__single_contract_probe
          description: 事前單口試單／Precommitted single-contract probe；08:45，300分鐘，仍需真實成交容量。
          overrides:
            trading:
              tw_futures_portfolio_entry_clock_path: data_tw_index_futures/training_prepared/tw_futures_universe765_20261027_v1/execution_all_twd_v8q/all_twd/clocks/entry_window_300m/0845/entries.parquet
              tw_futures_portfolio_opening_reference_path: data_tw_index_futures/training_prepared/tw_futures_universe765_20261027_v1/execution_all_twd_v8q/all_twd/clocks/entry_window_300m/0845/opening_reference.parquet
              tw_futures_portfolio_entry_capacity_policy: single_contract_probe
        - name: clock0845__300m__single_contract_probe_p100
          description: 全口成交窗研究／Whole-contract observed-window research；08:45，300分鐘，單口試單與100%實際觀察成交量；不同於原50%容量對照。
          overrides:
            trading:
              tw_futures_portfolio_entry_clock_path: data_tw_index_futures/training_prepared/tw_futures_universe765_20261027_v1/execution_all_twd_v8q/all_twd/clocks/entry_window_300m/0845/entries.parquet
              tw_futures_portfolio_opening_reference_path: data_tw_index_futures/training_prepared/tw_futures_universe765_20261027_v1/execution_all_twd_v8q/all_twd/clocks/entry_window_300m/0845/opening_reference.parquet
              tw_futures_portfolio_entry_capacity_policy: single_contract_probe
              max_volume_participation: 1.0
        - name: clock0900__1m__previous_session
          description: 相同歷史資訊對照／Same-history decision-time control；09:00，1分鐘。
          overrides:
            trading:
              tw_futures_portfolio_decision_time: '09:00'
