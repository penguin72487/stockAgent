# Preserve the old policy's representation and test the training-account axis.
# Every case starts from the exact old weights/RMS with a fresh optimizer.
base_config: configs/deployments/tw_day_trade_factorized_values_20261007_scale_separated_cash_annual_v1.yaml
output_root: artifacts/markets/tw_old_fold11_refinement_20261017_v4
fold_selection: last
runtime:
  parallel_jobs: 1
  cpu_threads: 8
  torch_compile_threads: 16
  capacity_retry: {max_retries: 2, minimum_train_batch: 32}
postprocess_plots:
  - {split: val, prefix: refinement_val, scope_label: calendar 2025 / pure log validation selected}
  - {split: test, prefix: refinement_test_diagnostic, scope_label: calendar 2026 / retrospective diagnostic}
matrix:
  mode: one_factor_at_a_time
  include_baseline: false
  base_overrides:
    walk_forward:
      split_start_year: 2015
    training:
      learning_rate: 0.00001
      pretrained_initialization_root: artifacts/markets/tw_day_trade_factorized_values_20261006_no_basis_flat_bf16_tf32_b128_scale_separated_cash_v1/training-bf16
      pretrained_initialization_trainable_parameter_prefixes: []
      day_trade_training_annual_episodes: true
      day_trade_annual_episode_sharding: true
  fixed_overrides:
    runner:
      require_cuda: true
      mode: train
      resume: false
      post_train_infer: false
      isolate_train_folds: false
    environment: {device: cuda, amp_dtype: bf16, cpu_threads: 8, torch_compile_threads: 16}
    data:
      benchmark_name: "2330"
      factorized_host_cache_bytes: 25769803776
    walk_forward:
      year_boundary_mode: calendar
      lookback_context: panel_history
    training:
      optimizer_name: adamw
      optimizer_options: {}
      seed: 42
      multi_gpu_strategy: distributed_data_parallel
      batch_size_train: 128
      batch_size_eval: 16
      lookback: 32
      epochs: 1000
      early_stopping_no_improve_ratio: 0.1
      early_stopping_min_delta: 0.0001
      best_checkpoint_max_epoch: 0
      val_interval_epochs: 1
      enable_lr_scheduler: true
      lr_scheduler: warmup_cosine
      lr_scheduler_t_max: 1000
      lr_scheduler_warmup_steps: 32
      lr_scheduler_eta_min: 0.000001
      grad_clip_norm: 1.0
      loss_type: log_utility
      warm_start_from_previous_fold: false
      pretrained_initialization_fold_policy: matching_validation_and_causal_train_superset
      pretrained_initialization_feature_adapter: identity_by_feature_name
      pretrained_initialization_require_exact_backbone: true
      pretrained_initialization_validation_guard: true
      pretrained_initialization_require_improvement_over_flat_cash: false
      day_trade_annual_episode_world_size: 2
      day_trade_optimizer_step_per_trajectory: true
      ddp_broadcast_buffers: false
      ddp_trajectory_gradient_sync: trajectory
      day_trade_sparse_events: true
      day_trade_sparse_event_slots: 262144
      day_trade_sub_lot_recovery: false
      day_trade_dense_allocation_backward: false
      debug_timing_sync: false
      financial_transformer:
        d_model: 32
        compiled_cross_attention_backend: manual
        temporal_blocks_fp32: true
        kernel_softmax_backend: quack
        factorized_sparse_projection: true
        factorized_sparse_cache_bytes: 12884901888
        factorized_encoder_force_retention: true
        factorized_cuda_graphs: true
        factorized_portfolio_cuda_graphs: true
        portfolio_output_mode: score_entmax_scale_separated_cash
    evaluation:
      gamma_sharpe: 1.0
      gamma_turnover: 0.0
      log_utility_risk_aversion: 0.0
      log_utility_downside_aversion: 0.0
      log_utility_benchmark_shortfall_aversion: 0.0
      eval_log_utility_pre_log_power: 0.0
      eval_log_utility_log_shift: 0.0
      eval_log_utility_periods_per_year: 252.0
  dimensions:
    - name: adaptation
      enabled: true
      variants:
        - name: all_parameters
          overrides: {}
        - name: score_head
          overrides:
            training:
              pretrained_initialization_trainable_parameter_prefixes: [score_head.]
        - name: recent_score_head
          overrides:
            walk_forward:
              split_start_year: 2020
            training:
              pretrained_initialization_trainable_parameter_prefixes: [score_head.]
        - name: continuous_all_parameters
          overrides:
            training:
              day_trade_training_annual_episodes: false
              day_trade_annual_episode_sharding: false
