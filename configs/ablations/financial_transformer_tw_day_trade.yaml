# Unified OFAT ablation matrix for the open-aware TW day-trade long/short
# model. Architecture variants hold projection-L1 fixed; the final dimension
# deliberately varies the portfolio output contract.
base_config: configs/markets/tw_public_lanten_market_candles.yaml
output_root: artifacts/ablations/financial_transformer_tw_day_trade_long_short_candles_projection_l1_capital10m_split_only_v3
expected_fold_count: 12

runtime:
  cpu_threads: 112
  torch_compile_threads: 16

matrix:
  mode: one_factor_at_a_time
  include_baseline: true
  fixed_overrides:
    walk_forward:
      # Test ownership is [this year's first complete in-split lookback,
      # next year's first complete in-split lookback), not panel-history day 1.
      lookback_context: split_only
    trading:
      execution_mode: tw_day_trade
      # Buy/open-long -> sell-at-close and sell-first -> cover-at-close are
      # both active, subject to the point-in-time day-trade eligibility masks.
      long_only: false
    training:
      # Keep the candles baseline objective fixed across every OFAT variant.
      loss_type: log_utility

  base_overrides:
    runner:
      # train.py already reloads the best checkpoint and writes complete fold
      # metrics/artifacts; a second post-train inference pass is redundant.
      post_train_infer: false
    trading:
      # Canonical OFAT capital. Every non-capital ablation inherits TWD 10M;
      # only the explicit initial_capital dimension may change it.
      volume_participation_equity: 10000000.0
      # Baseline post-processing for model outputs that already satisfy the
      # signed gross-exposure contract.
      portfolio_activation: pre_normalized
    training:
      loss_portfolio_activation: pre_normalized
      financial_transformer:
        # Every architecture/sequence variant inherits projection-L1. Only
        # the explicit portfolio_output_mode dimension below overrides it.
        portfolio_output_mode: projection_l1

  dimensions:
    - name: lookback_batch
      enabled: true
      paths: [training.lookback, training.batch_size_train]
      baseline: [32, 128]
      values:
        - name: lookback256_batch32
          experiment_name: lookback256_batch32
          value: [256, 32]
          overrides:
            training:
              batch_size_eval: 16
              eval_model_chunk_rows: 16
              eval_auto_chunk_rows_cap: 16

    - name: information_bottleneck
      enabled: true
      baseline: [true, true]
      variants:
        - name: latent_only
          experiment_name: latent_only
          overrides:
            training:
              financial_transformer:
                use_latent_factors: true
                use_market_tokens: false
        - name: market_only
          experiment_name: market_only
          overrides:
            training:
              financial_transformer:
                use_latent_factors: false
                use_market_tokens: true
        - name: temporal_only
          experiment_name: temporal_only
          overrides:
            training:
              financial_transformer:
                use_latent_factors: false
                use_market_tokens: false

    - name: temporal_rope
      enabled: true
      path: training.financial_transformer.rope_temporal
      baseline: true
      values:
        - {name: disabled, experiment_name: no_rope_temporal, value: false}

    - name: learned_time_position
      enabled: true
      path: training.financial_transformer.use_time_pos
      baseline: true
      values:
        - {name: disabled, experiment_name: no_time_position, value: false}

    - name: learned_symbol_position
      enabled: true
      path: training.financial_transformer.use_symbol_pos
      baseline: false
      values:
        - {name: enabled, experiment_name: with_symbol_position, value: true}

    - name: qk_normalization
      enabled: true
      path: training.financial_transformer.qk_norm
      baseline: true
      values:
        - {name: disabled, experiment_name: no_qk_norm, value: false}

    - name: temporal_pooling
      enabled: true
      baseline: last
      variants:
        - name: mean
          experiment_name: mean_pooling
          overrides:
            training:
              financial_transformer:
                temporal_pooling: mean
                temporal_query_mode: full_then_last
        - name: attention
          experiment_name: attention_pooling
          overrides:
            training:
              financial_transformer:
                temporal_pooling: attention
                temporal_query_mode: full_then_last

    - name: normalization
      enabled: true
      path: training.financial_transformer.norm_type
      baseline: rmsnorm
      values:
        - {name: layernorm, experiment_name: layernorm, value: layernorm}

    - name: feed_forward
      enabled: true
      path: training.financial_transformer.ffn_type
      baseline: swiglu
      values:
        - {name: gelu, experiment_name: gelu_ffn, value: gelu}

    - name: initial_capital
      enabled: true
      # This is the absolute-equity anchor used by the Taiwan integer audit
      # and by the causal volume-participation weight cap. It is distinct from
      # tw_short_initial_margin_rate, which remains the official margin ratio.
      path: trading.volume_participation_equity
      baseline: 10000000.0
      values:
        - name: 1m
          experiment_name: initial_capital_1m
          value: 1000000.0
        - name: 100m
          experiment_name: initial_capital_100m
          value: 100000000.0

    - name: portfolio_output_mode
      enabled: true
      baseline: projection_l1
      variants:
        - name: activation_l1
          experiment_name: output_activation_l1
          overrides:
            trading:
              portfolio_activation: identity
            training:
              loss_portfolio_activation: identity
              financial_transformer:
                portfolio_output_mode: activation_l1
        - name: l1
          experiment_name: output_l1
          overrides:
            training:
              financial_transformer:
                portfolio_output_mode: l1
        - name: logits
          experiment_name: output_logits
          overrides:
            trading:
              portfolio_activation: identity
            training:
              loss_portfolio_activation: identity
              financial_transformer:
                portfolio_output_mode: logits
        - name: signed_softmax
          experiment_name: output_signed_softmax
          overrides:
            training:
              financial_transformer:
                portfolio_output_mode: signed_softmax
        - name: signed_entmax15
          experiment_name: output_signed_entmax15
          overrides:
            training:
              financial_transformer:
                portfolio_output_mode: signed_entmax15
        - name: signed_sparsemax
          experiment_name: output_signed_sparsemax
          overrides:
            training:
              financial_transformer:
                portfolio_output_mode: signed_sparsemax
