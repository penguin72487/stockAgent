# First-principles systems OFAT for the v6 symbol-sharded recurrent ledger.
#
# This matrix diagnoses throughput, not investment quality.  Every row keeps
# the same Fold-11 data, model, execution, fee, objective, seed, and plotting
# contract.  Each variant removes exactly one systems mechanism from the v6
# control.  The only sizing row uses another power-of-two global batch.
base_config: configs/markets/tw_day_trade_daily_executable_portfolio_transformer_22_basis_tplus2_close_capital10m_v6_symbol_sharded.yaml
output_root: artifacts/ablations/executable_portfolio_transformer_symbol_sharded_ledger_fold11_v1
expected_fold_count: 12

pinned_panel_cache:
  snapshot_id: tw-public-20260820T015018219623218Z-l0-penguin-6716296ea30636ba
  variant_id: c8b02a7a891549c4108c0307a8db47cdc34f17e9b17aa75afbdd79089c1748ac
  version: 51
  generation: 67458178ae924a0188d98841e9b17229
  source_hash: 31f3e4f1e31338bb9c0fd52494cc0d840a5081ffeab00a1fceddfa3412258fe0

runtime:
  parallel_jobs: 1
  cpu_threads: 112
  torch_compile_threads: 16

matrix:
  mode: one_factor_at_a_time
  include_baseline: true

  base_overrides:
    runner:
      resume: true
      post_train_infer: false
    training:
      # Epoch 1 warms all train/eval ABIs. Epochs 2-3 are the bounded steady
      # observations used by the default Fold-11 systems benchmark launcher.
      epochs: 3
      early_stopping_no_improve_ratio: 0.0
      batch_size_train: 128
      batch_size_eval: 16
      auto_batch_size: false
      distributed_symbol_sharded_ledger: true
      distributed_symbol_sharded_pack_metadata: true
      distributed_symbol_sharded_pack_scalars: true
      distributed_symbol_sharded_skip_noop_collectives: true

  fixed_overrides:
    training:
      # These observability fields are controls, not optimization dimensions.
      record_epoch_curve: true
      curve_plot_interval: 1
      curve_test_interval: 1
      curve_plot_async: true
      epoch_test_curve: true
      defer_epoch_curve_plot_until_end: false
      debug_timing_sync: false

  dimensions:
  - name: ledger_layout
    enabled: true
    path: training.distributed_symbol_sharded_ledger
    baseline: true
    values:
    - name: replicated
      experiment_name: replicated_ledger
      value: false
      description: Replicate the full 128x2746 recurrent ledger on both ranks.

  - name: metadata_collective_coalescing
    enabled: true
    path: training.distributed_symbol_sharded_pack_metadata
    baseline: true
    values:
    - name: disabled
      experiment_name: unpacked_metadata_collectives
      value: false
      description: Launch one time-to-symbol collective per execution tensor.

  - name: scalar_collective_coalescing
    enabled: true
    path: training.distributed_symbol_sharded_pack_scalars
    baseline: true
    values:
    - name: disabled
      experiment_name: unpacked_scalar_collectives
      value: false
      description: AllReduce every account scalar separately instead of packed vectors.

  - name: noop_collective_specialization
    enabled: true
    path: training.distributed_symbol_sharded_skip_noop_collectives
    baseline: true
    values:
    - name: disabled
      experiment_name: keep_noop_collectives
      value: false
      description: Retain globally empty default and dividend collectives.

  - name: model_compilation
    enabled: true
    variants:
    - name: eager
      experiment_name: eager_model
      description: Disable train and evaluation model torch.compile only.
      overrides:
        training:
          enable_torch_compile: false
          compile_eval_model: false

  - name: ledger_compilation
    enabled: true
    variants:
    - name: eager
      experiment_name: eager_ledger
      description: Disable compiled recurrent-ledger kernels only.
      overrides:
        training:
          backtest_compile: false
          backtest_compile_stateful: false
          eval_backtest_compile: false

  - name: global_batch
    enabled: true
    path: training.batch_size_train
    baseline: 128
    values:
    - name: batch64
      experiment_name: batch64
      value: 64
      description: Power-of-two global batch 64, local batch 32 per rank.
