base_config: configs/markets/tw_futures_residual_policy_20261024_v1.yaml
output_root: artifacts/markets/tw_futures_residual_policy_20261024_v1
fold_selection: last
runtime:
  parallel_jobs: 1
  cpu_threads: 8
  torch_compile_threads: 8
  capacity_retry:
    max_retries: 2
    minimum_train_batch: 32
postprocess_plots:
  - split: val
    prefix: val
    comparison_mode: absolute
    scope_label: Paired prior-notional output study; selection uses validation only
  - split: test
    prefix: test
    comparison_mode: absolute
    scope_label: Previously inspected research period; not an untouched holdout
matrix:
  mode: one_factor_at_a_time
  include_baseline: false
  fixed_overrides:
    training:
      epochs: 1000
      early_stopping_no_improve_ratio: 0.1
      early_stopping_min_delta: 0.0001
      pretrained_initialization_root: null
      warm_start_from_previous_fold: false
      loss_type: log_utility
    runner:
      resume: false
      require_cuda: true
  dimensions:
    - name: twd_equity
      enabled: true
      variants:
        - name: free_0845
          description: 自由多空／Unconstrained long-short；08:45；名目本金座標對照。
          overrides: {}
        - name: net025_0845
          description: 限制淨曝險／Bounded net exposure；08:45；先驗名目淨額上限為 NAV 的 25%。
          overrides:
            training:
              financial_transformer:
                futures_net_notional_cap: 0.25
        - name: neutral_0845
          description: 先驗名目本金中性／Prior-notional neutral；08:45；相對價值輸出。
          overrides:
            training:
              financial_transformer:
                futures_net_notional_cap: 0.0
        - name: free_0900
          description: 自由多空／Unconstrained long-short；09:00；相同歷史特徵。
          overrides: &clock0900
            trading:
              tw_futures_portfolio_decision_time: '09:00'
              tw_futures_portfolio_entry_clock_path: data_tw_index_futures/training_prepared/tw_futures_equity_weekly_spread_20261023_v3/twd_equity/clocks/0900/entries.parquet
              tw_futures_portfolio_opening_reference_path: data_tw_index_futures/training_prepared/tw_futures_equity_weekly_spread_20261023_v3/twd_equity/clocks/0900/opening_reference.parquet
        - name: net025_0900
          description: 限制淨曝險／Bounded net exposure；09:00；先驗名目淨額上限為 NAV 的 25%。
          overrides:
            <<: *clock0900
            training:
              financial_transformer:
                futures_net_notional_cap: 0.25
        - name: neutral_0900
          description: 先驗名目本金中性／Prior-notional neutral；09:00；相對價值輸出。
          overrides:
            <<: *clock0900
            training:
              financial_transformer:
                futures_net_notional_cap: 0.0
