# Reuse the admitted 2011 paired-clock baseline and its exact margin ledger.
# Run only after both baseline cases terminate. Each case starts from scratch.
base_config: configs/markets/tw_stock_futures_carry_0845_history2011_20261021_v5.yaml
output_root: artifacts/markets/tw_stock_futures_conditioning_20261023_v1
fold_selection: last
runtime:
  parallel_jobs: 1
  cpu_threads: 8
  torch_compile_threads: 8
  capacity_retry:
    max_retries: 2
    minimum_train_batch: 32
postprocess_plots:
  - split: val
    prefix: val
    comparison_mode: absolute
    scope_label: 2011-start futures conditioning study; validation-only selection
  - split: deployment
    prefix: deployment
    comparison_mode: absolute
    scope_label: Latest-period research; fixed predeclared cases
  - split: test
    prefix: test
    comparison_mode: absolute
    scope_label: Same-calendar futures research; not an untouched holdout
matrix:
  mode: one_factor_at_a_time
  include_baseline: false
  fixed_overrides:
    training:
      loss_type: log_utility
      lookback: 32
      batch_size_train: 128
      epochs: 1000
      early_stopping_no_improve_ratio: 0.1
      early_stopping_min_delta: 0.0001
      pretrained_initialization_root: null
      warm_start_from_previous_fold: false
      multi_gpu_strategy: distributed_data_parallel
      futures_portfolio_optimizer_step_per_trajectory: true
      financial_transformer:
        d_model: 32
      record_epoch_curve: true
      curve_plot_interval: 1
      curve_plot_async: false
      defer_epoch_curve_plot_until_end: false
    runner:
      resume: false
      require_cuda: true
  dimensions:
    - name: clock0845
      enabled: true
      variants:
        - name: notional
          description: 名目本金座標／Notional-coordinate policy；只改先驗 IM/notional 尺度。
          overrides:
            training:
              financial_transformer:
                futures_notional_score_coordinates: true
        - name: adamw_lr3e5
          description: 較大 AdamW 步長／Larger AdamW step；學習率 1e-5 → 3e-5。
          overrides:
            training:
              learning_rate: 0.00003
        - name: muon
          description: 隱藏矩陣正交更新／Muon hidden matrices；輸入、嵌入與輸出頭維持 AdamW。
          overrides:
            training:
              optimizer_name: muon
              optimizer_options:
                matrix_lr_scale: 1.0
                aux_lr_scale: 1.0
                adjust_lr_fn: match_rms_adamw
        - name: notional_lr3e5
          description: 名目座標＋較大步長／Notional coordinates + larger AdamW step。
          overrides:
            training:
              learning_rate: 0.00003
              financial_transformer:
                futures_notional_score_coordinates: true
        - name: notional_muon
          description: 名目座標＋Muon／Notional coordinates + Muon hidden matrices。
          overrides:
            training:
              optimizer_name: muon
              optimizer_options:
                matrix_lr_scale: 1.0
                aux_lr_scale: 1.0
                adjust_lr_fn: match_rms_adamw
              financial_transformer:
                futures_notional_score_coordinates: true
    - name: clock0900
      enabled: true
      variants:
        - name: notional
          description: 09:00 名目本金座標／Notional-coordinate policy。
          overrides:
            trading: &clock0900
              tw_futures_portfolio_decision_time: '09:00'
              tw_futures_portfolio_entry_clock_path: artifacts/data_preparation/tw_stock_futures_history2011_20261021_v5/clocks/0900/entries.parquet
              tw_futures_portfolio_opening_reference_path: artifacts/data_preparation/tw_stock_futures_history2011_20261021_v5/clocks/0900/opening_reference.parquet
            training:
              financial_transformer:
                futures_notional_score_coordinates: true
        - name: adamw_lr3e5
          description: 09:00 較大 AdamW 步長／Larger AdamW step。
          overrides:
            trading: *clock0900
            training:
              learning_rate: 0.00003
        - name: muon
          description: 09:00 隱藏矩陣正交更新／Muon hidden matrices。
          overrides:
            trading: *clock0900
            training:
              optimizer_name: muon
              optimizer_options:
                matrix_lr_scale: 1.0
                aux_lr_scale: 1.0
                adjust_lr_fn: match_rms_adamw
        - name: notional_lr3e5
          description: 09:00 名目座標＋較大步長／Notional coordinates + larger AdamW step。
          overrides:
            trading: *clock0900
            training:
              learning_rate: 0.00003
              financial_transformer:
                futures_notional_score_coordinates: true
        - name: notional_muon
          description: 09:00 名目座標＋Muon／Notional coordinates + Muon hidden matrices。
          overrides:
            trading: *clock0900
            training:
              optimizer_name: muon
              optimizer_options:
                matrix_lr_scale: 1.0
                aux_lr_scale: 1.0
                adjust_lr_fn: match_rms_adamw
              financial_transformer:
                futures_notional_score_coordinates: true
