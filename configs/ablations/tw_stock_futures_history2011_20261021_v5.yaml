base_config: configs/markets/tw_stock_futures_carry_0845_history2011_20261021_v5.yaml
output_root: artifacts/markets/tw_stock_futures_history2011_20261021_v5
fold_selection: last
matrix:
  mode: one_factor_at_a_time
  include_baseline: false
  fixed_overrides:
    training:
      epochs: 1000
      early_stopping_no_improve_ratio: 0.1
      early_stopping_min_delta: 0.0001
      pretrained_initialization_root: null
      warm_start_from_previous_fold: false
    runner:
      resume: false
      require_cuda: true
  dimensions:
    - name: clock
      enabled: true
      variants:
        - name: '0845'
          description: '2011起；08:45觀測開盤參考、跨日持倉 / from scratch, observed open reference, futures carry.'
          overrides: {}
        - name: '0900'
          description: '2011起；09:00觀測開盤參考、跨日持倉 / from scratch, observed open reference, futures carry.'
          overrides:
            trading:
              tw_futures_portfolio_decision_time: '09:00'
              tw_futures_portfolio_entry_clock_path: artifacts/data_preparation/tw_stock_futures_history2011_20261021_v5/clocks/0900/entries.parquet
              tw_futures_portfolio_opening_reference_path: artifacts/data_preparation/tw_stock_futures_history2011_20261021_v5/clocks/0900/opening_reference.parquet
