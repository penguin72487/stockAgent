# Ten independent scratch policies; common seed, data, network and MGDA/SGD recipe.
base_config: configs/markets/tw_day_trade_unit_mgda_capital_20261103_v1.yaml
output_root: artifacts/markets/tw_day_trade_unit_mgda_capital_limitup_20261103_v1
# Original fixed-snapshot last fold is 10; base runner and launcher both pin it.
runtime:
  parallel_jobs: 1
  cpu_threads: 8
  torch_compile_threads: 16
  capacity_retry:
    max_retries: 2
    minimum_train_batch: 32
postprocess_plots:
- split: val
  prefix: capital_val
  scope_label: 2025 validation / after-cost log utility
- split: test
  prefix: capital_test_diagnostic
  scope_label: 2026 retrospective diagnostic / every trading session
matrix:
  mode: one_factor_at_a_time
  include_baseline: false
  dimensions:
  - name: capital
    enabled: true
    variants:
    - name: twd_1000000
      description: Initial capital TWD 1,000,000; source-residual limit-up short close cost 7%.
      overrides:
        trading:
          volume_participation_equity: 1000000.0
          tw_minute_initial_equity: 1000000.0
    - name: twd_2000000
      description: Initial capital TWD 2,000,000; source-residual limit-up short close cost 7%.
