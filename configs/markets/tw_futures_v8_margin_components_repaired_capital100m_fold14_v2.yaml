base_config: tw_futures_v8_margin_components_capital100m_20261003.yaml
experiment_name: tw-futures-margin-components-repaired-capital100m-fold14-v2

trading:
  tw_futures_portfolio_data_path: artifacts/markets/tw_futures_v8_margin_preparation/margin_components_position_review_20261003/release/daily/continuous_daily.parquet
  tw_futures_portfolio_margin_rules_path: artifacts/markets/tw_futures_v8_margin_preparation/margin_components_position_review_20261003/release/rules/rules.parquet
  tw_futures_portfolio_integer_initial_capital: 100000000
  tw_futures_portfolio_benchmark_mode: tx_front_rolling_1x_gross
