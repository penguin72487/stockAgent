base_config: tw_public_multi_basis.yaml

experiment_name: tw-public-financial-transformer-multi-basis-online-complete-feature-input-lookback32-v3

runner:
  # This model owns a trainable temporal dictionary and a wider input projection;
  # it is intentionally incompatible with raw-only and gated-basis checkpoints.
  output_dir: artifacts/markets/tw_public_candles_multi_basis_online_complete_feature_input_lookback32_v3
  resume: false

training:
  transformer_base_portfolio:
    # All families consume only the observed trailing window and have static
    # shapes. Four coefficients per family bound live inference and training
    # cost while retaining complementary mechanisms rather than synonyms.
    temporal_basis_families:
      - haar
      - swt_db2
      - swt_sym4
      - wavelet_packet
      - walsh
      - fourier
      - dct
      - dpss
      - local_cosine
      - morlet
      - exponential
      - laguerre
      - difference
      - ar_innovation
      - bspline
      - legendre
      - chebyshev
      - learned
    temporal_basis_components: 4
