base_config: tw_public_multi_basis.yaml

experiment_name: tw-public-financial-transformer-multi-basis-online-complete-ordinary-input-features-lookback32-v1

runner:
  # This root is checkpoint-incompatible with the old post-temporal basis
  # branch. Basis coefficients now occupy ordinary CandleEncoder input columns.
  output_dir: artifacts/markets/tw_public_candles_multi_basis_online_complete_input_features_lookback32_v1
  resume: false

training:
  # The inherited candles baseline was measured on two 32 GiB RTX 5090s:
  # global batch 128 becomes local batch 64 and the full panel can stay on
  # each GPU.  This complete 18-family basis experiment is also run on the
  # single 16 GiB RTX 4070 Ti SUPER workstation.  There, local batch 128 fails
  # the compiled forward/backward probe even without the panel cache, while
  # local batch 64 with host-resident shared tensors completes model/loss
  # probes and the full train/validation/test epoch workflow.
  batch_size_train: 64
  cache_train_tensors_on_gpu: false
  cache_eval_tensors_on_gpu: false
  vram_budget_gb: 16

  transformer_base_portfolio:
    # Every family consumes each named raw feature over the observed trailing
    # window. The endpoint row is [ordinary features, basis coefficients]; all
    # 7,227 columns share one RMSNorm and one CandleEncoder projection. There
    # is no post-temporal basis branch, gate, or separate feature encoder.
    temporal_basis_input: input_features
    temporal_basis_families:
      - haar
      - swt_db2
      - swt_sym4
      - wavelet_packet
      - walsh
      - fourier
      - dct
      - dpss
      - local_cosine
      - morlet
      - exponential
      - laguerre
      - difference
      - ar_innovation
      - bspline
      - legendre
      - chebyshev
      - learned
    temporal_basis_components: 4
