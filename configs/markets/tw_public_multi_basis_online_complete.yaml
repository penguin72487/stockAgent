base_config: tw_public_multi_basis.yaml

experiment_name: tw-public-financial-transformer-multi-basis-online-complete-raw-feature-input-lookback32-v4

runner:
  # The completed v4 artifact decomposed the 32-D latent representation.  This
  # new root decomposes all 99 raw features and is checkpoint-incompatible.
  output_dir: artifacts/markets/tw_public_candles_multi_basis_online_complete_raw_feature_input_lookback32_v5
  resume: false

training:
  # The inherited candles baseline was measured on two 32 GiB RTX 5090s:
  # global batch 128 becomes local batch 64 and the full panel can stay on
  # each GPU.  This complete 18-family basis experiment is also run on the
  # single 16 GiB RTX 4070 Ti SUPER workstation.  There, local batch 128 fails
  # the compiled forward/backward probe even without the panel cache, while
  # local batch 64 with host-resident shared tensors completes model/loss
  # probes and the full train/validation/test epoch workflow.
  batch_size_train: 64
  cache_train_tensors_on_gpu: false
  cache_eval_tensors_on_gpu: false
  vram_budget_gb: 16

  transformer_base_portfolio:
    # Every family consumes each named raw feature over the observed trailing
    # window.  The untouched CandleEncoder + temporal Transformer is retained
    # as the time-domain path and fused with all basis coefficients afterward.
    temporal_basis_input: raw_features
    temporal_basis_families:
      - haar
      - swt_db2
      - swt_sym4
      - wavelet_packet
      - walsh
      - fourier
      - dct
      - dpss
      - local_cosine
      - morlet
      - exponential
      - laguerre
      - difference
      - ar_innovation
      - bspline
      - legendre
      - chebyshev
      - learned
    temporal_basis_components: 4
