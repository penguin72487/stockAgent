experiment_name: tw-stock-transformer-market-public-data-epyc7662-dual5090

runner:
  output_dir: artifacts/markets/tw_parallel_epyc7662_dual5090
  mode: train
  resume: true
  post_train_infer: true
  start_fold: 1
environment:
  device: cuda
  use_tensor_cores: true
  amp_dtype: bf16
  cudnn_benchmark: false
  # AMD EPYC 7662: 64 physical cores / usually 128 logical threads with SMT.
  cpu_threads: 128
  torch_compile_threads: 128

data:
  parquet_root: data_yahoo/tw_stocks
  benchmark_name: "2330"
  usd_only_trading_pairs: false
  panel_backend: auto
  panel_load_workers: 128
  trading_volume_policy: auto
  tradable_mode: tw_limit_guard
  use_tw_public_features: true
  use_tw_public_rules: true
  tw_public_feature_path: data_tw_public/features/tw_public_stock_daily.parquet
  tw_public_market_symbol: "__MARKET__"
  # Manual feature switch.
  # Default below keeps every current panel feature enabled.
  # To disable one feature, add "#" before that feature line.
  # Changing this list changes model input_dim; use a fresh output_dir or resume=false.
  # Exact feature names and glob patterns are both supported.
  feature_include:
    # Base price log returns
    # - open_logret_1d
    # - max_logret_1d
    # - min_logret_1d
    # - close_logret_1d

    # Base volume
    - trading_volume_logret_1d
    - signed_vol

    # Base K-bar body
    - body_ratio
    - signed_body_ratio
    - delta_body_ratio

    # Base close location value
    - clv
    - clv_centered
    - delta_clv

    # Base shadows
    - upper_shadow
    - lower_shadow
    - shadow_imbalance

    # TW public official daily price/volume
    # - twpub_official_close_logret_1d
    # - twpub_official_trading_volume_log
    # - twpub_official_trading_value_log
    # - twpub_official_trades_log
    # - twpub_official_turnover_ratio
    # - twpub_official_intraday_range
    # - twpub_official_close_to_high
    # - twpub_official_close_to_low
    # - twpub_tpex_next_limit_up_ret
    # - twpub_tpex_next_limit_down_ret

    # TW public valuation
    - twpub_pe_log
    - twpub_pb_log
    # - twpub_dividend_yield
    # - twpub_dividend_per_share_log

    # TW public margin / short balance
    - twpub_margin_balance_log
    - twpub_margin_balance_chg
    # - twpub_short_balance_log
    - twpub_short_balance_chg
    - twpub_margin_buy_flow
    - twpub_margin_sell_flow
    - twpub_short_sell_flow
    - twpub_short_buy_flow

    # TW public institutional flow
    - twpub_foreign_net_buy_flow
    - twpub_investment_trust_net_buy_flow
    - twpub_dealer_net_buy_flow
    - twpub_institutional_net_buy_flow

    # Point-in-time monthly revenue / financial statements
    - twpub_monthly_revenue_log
    - twpub_monthly_revenue_mom
    - twpub_monthly_revenue_yoy
    - twpub_cumulative_revenue_yoy
    - twpub_financial_eps
    - twpub_financial_revenue_log
    - twpub_financial_net_income_asinh
    - twpub_financial_gross_margin
    - twpub_financial_operating_margin
    - twpub_financial_net_margin
    - twpub_financial_assets_log
    - twpub_financial_debt_ratio
    - twpub_financial_current_ratio
    - twpub_financial_equity_ratio
    - twpub_financial_book_value_per_share_log

    # Point-in-time ownership / securities lending
    - twpub_insider_holdings_log
    - twpub_insider_pledge_ratio
    - twpub_insider_transfer_shares_log
    - twpub_borrow_available_log
    - twpub_sbl_balance_log
    - twpub_short_sale_available_log

    # TW public TDCC holders
    - twpub_tdcc_retail_holder_ratio
    - twpub_tdcc_large_holder_ratio
    - twpub_tdcc_holder_count_log

    # TW public company profile
    - twpub_company_paidin_capital_log
    - twpub_company_issued_shares_log
    - twpub_company_private_shares_log
    - twpub_company_age_years
    - twpub_company_listed_age_years
    - twpub_company_par_value_log
    # - twpub_company_industry_code
    # - twpub_company_is_foreign
    # - twpub_company_has_preferred_stock

    # TW public dividend / ex-dividend
    # - twpub_dividend_cash_per_share
    # - twpub_dividend_stock_per_share
    # - twpub_dividend_total_cash_log
    # - twpub_dividend_total_stock_log
    # - twpub_dividend_confirmed
    # - twpub_dividend_board_approved
    # - twpub_dividend_year
    # - twpub_exdiv_known
    # - twpub_exdiv_cash_dividend
    # - twpub_exdiv_stock_dividend_ratio
    # - twpub_exdiv_subscription_ratio
    # - twpub_exdiv_subscription_price_log

    # TW public material events / attention / disposal
    # - twpub_material_event_count_log
    # - twpub_material_clause_log
    # - twpub_material_fact_lag_days
    # - twpub_attention_flag
    # - twpub_attention_count_log
    # - twpub_attention_close_log
    # - twpub_attention_pe_log
    # - twpub_disposal_flag
    # - twpub_disposal_count_log

    # TW public market index / FX
    # - twpub_twse_taiex_log
    # - twpub_twse_taiex_logret_1d
    # - twpub_twse_taiex_pct
    # - twpub_usdtwd_log
    # - twpub_usdtwd_logret_1d

    # TW public CBC monetary data
    # - twpub_cbc_overnight_rate
    # - twpub_cbc_overnight_rate_chg
    # - twpub_cbc_fx_reserves_log
    # - twpub_cbc_fx_reserves_chg
    # - twpub_cbc_m1b_log
    # - twpub_cbc_m1b_yoy
    # - twpub_cbc_m2_log
    # - twpub_cbc_m2_yoy

    # TW public macro / MOF
    - twpub_dgbas_cpi_log
    - twpub_dgbas_cpi_yoy
    - twpub_dgbas_unemployment_rate
    # - twpub_dgbas_gdp_log
    # - twpub_dgbas_gdp_yoy
    - twpub_mof_export_log
    - twpub_mof_import_log
    - twpub_mof_trade_balance_asinh
    - twpub_mof_tax_total_log
    - twpub_mof_securities_tax_log
    - twpub_mof_futures_tax_log
    - twpub_mof_business_tax_log

    # TW public TAIFEX futures / options
    # - twpub_taifex_tx_volume_log
    # - twpub_taifex_tx_open_interest_log
    # - twpub_taifex_tx_settlement_logret_1d
    # - twpub_taifex_txo_call_volume_log
    # - twpub_taifex_txo_put_volume_log
    # - twpub_taifex_txo_put_call_volume_ratio
    # - twpub_taifex_txo_call_oi_log
    # - twpub_taifex_txo_put_oi_log
    # - twpub_taifex_txo_put_call_oi_ratio
    # - twpub_taifex_dealer_net_oi_asinh
    # - twpub_taifex_foreign_net_oi_asinh
    # - twpub_taifex_trust_net_oi_asinh
    # - twpub_taifex_tx_top5_long_ratio
    # - twpub_taifex_tx_top10_long_ratio
    # - twpub_taifex_tx_large_oi_log
    # - twpub_taifex_tx_final_settlement_logret

  # Optional bulk deny-list. Usually keep this empty when using feature_include above.
  feature_exclude:
    # - twpub_company_*
    # - twpub_dividend_*
  # tradable_mode: tradable

walk_forward:
  min_train_years: 1
  val_years: 1
  # false adds an experimental final fold where the latest year is both val and test.
  require_future_test_year: false

trading:
  frequency: daily
  buy_fee_rate: 0.000855
  sell_fee_rate: 0.003855
  max_turnover_ratio: 0.0
  max_volume_participation: 0.5
  volume_participation_equity: 1000000.0
  reporting_leverage: 2.5
  min_trade_weight: 0.0
  portfolio_activation: identity
  long_only: false
training:
  non_blocking_transfer: true
  model_name: transformer_base_portfolio
  # Dual RTX 5090 DDP training path. train.py auto-relaunches itself under
  # torchrun when this strategy is selected, so the normal command remains:
  #   python train.py --config configs/markets/tw_parallel.yaml
  #
  # Historical DDP hotpath profile on EPYC 7662 + dual RTX 5090 (these are
  # measurement shapes, not the current defaults below):
  # - measured world_size=2, global_batch_size=128, local_batch_size=64
  # - torch.compile model=true, compile_mode=default, order=model_before_ddp
  # - canonical fullgraph log-utility loss; cold compile time is accepted
  # - fold21 historical recheck: global batch128 and 256 were both about 620 rows/s,
  #   so the recurrent full-batch log-utility scan is the throughput limiter.
  #   Increasing batch size alone does not materially improve GPU occupancy.
  multi_gpu_strategy: distributed_data_parallel
  ddp_bucket_cap_mb: 4
  # DDP compiles the bare model before wrapping it in DistributedDataParallel,
  # so Dynamo does not trace DDP broadcast/reducer internals. The recurrent
  # canonical loss is compiled as one full graph so rule execution and the
  # objective cannot drift into separate fast/debug formulas.
  # Runtime also disables Inductor Triton mix-order reduction by default
  # (STOCKAGENT_INDUCTOR_MIX_ORDER_REDUCTION=0) because PyTorch CUDA 13 hit
  # a compiled-backward scheduler assertion in that fusion pass on RTX 5090.
  enable_torch_compile: true
  auto_torch_compile_sharpe: false
  torch_compile_mode: default
  torchinductor_cache_dir: ~/.cache/torchinductor
  triton_cache_dir: ~/.cache/triton
  cuda_cache_path: ~/.cache/nv_cuda
  compile_loss: true
  loss_portfolio_activation: identity
  warm_start_from_previous_fold: false
  chunk_rows: 0
  eval_model_chunk_rows: auto
  eval_backtest_chunk_rows: 512
  eval_backtest_chunk_rows_auto: true
  eval_backtest_compile: false
  eval_auto_chunk_rows_cap: 64
  # Explicit comparison knob: train_union changes the training symbol universe
  # to the fold's active-symbol union; set none for full-symbol parity runs.
  train_symbol_compaction: train_union
  train_symbol_compaction_bucket_size: 0
  backtest_autotune: false
  backtest_compile: true
  backtest_compile_stateful: true
  backtest_compile_dynamic: false
  inference_backtest_autotune: false
  inference_backtest_compile: false
  backtest_verbose: false
  strict_no_fallback: true
  backtest_checkpoint_chunk_rows: 0
  runtime_shape_check: false
  allow_dynamic_symbols: false
  lookback: 32
  # DDP treats this as the effective global batch and divides it across ranks;
  # with world_size=2 the current local batch is 16.
  batch_size_train: 128
  batch_size_eval: 128
  epochs: 1000
  early_stopping_no_improve_ratio: 0.1
  val_interval_epochs: 1
  curve_test_interval: 1
  record_epoch_curve: true
  curve_plot_interval: 1
  curve_plot_async: true
  plot_backend: auto
  epoch_test_curve: true
  defer_epoch_curve_plot_until_end: false
  explain_after_each_fold: false
  explain_first_test_year_only: true
  explain_top_k: 20
  explain_max_rows: 32
  explain_ig_steps: 0
  explain_ig_batch_size: 1
  explain_sample_method: even
  explain_perturb: false
  explain_perturb_batch_size: 1
  explain_perturb_max_auto_batch_size: 1
  explain_perturb_max_input_elements: 8000000
  explain_write_plots: false
  explain_report_style: none
  explain_plot_theme: paper
  explain_standard_plots: false
  explain_interactive_plots: false
  explain_shap_enabled: false
  explain_shap_mode: score_head_surrogate
  explain_case_study_top_k: 5
  explain_regime_analysis: false
  explain_fold_stability: false
  explain_umap_enabled: false
  explain_umap_max_points: 1000
  explain_umap_max_projections: 0
  explain_umap_n_neighbors: 15
  explain_umap_min_dist: 0.1
  explain_cross_asset_enabled: false
  explain_cross_asset_max_sources: 8
  explain_cross_asset_max_targets: 8
  explain_cross_asset_top_edges: 150
  explain_cross_asset_source_chunk_size: 1
  explain_cross_asset_perturb_scale: 1.0
  explain_cross_asset_shocks: [zero, momentum, gap, volume, volatility, liquidity]
  explain_cross_asset_attention_flow: true
  explain_cross_asset_attention_capture_rows: 1
  explain_cross_asset_validated_transmission: true
  explain_cross_asset_role_embedding: false
  explain_cross_asset_graph_backend: cugraph
  explain_cross_asset_graph_benchmark_min_edges: 1000000
  explain_cross_asset_graph_explainability: true
  explain_cross_asset_graph_betweenness_max_vertices: 512
  explain_cross_asset_graph_plot_max_nodes: 80
  table_output_format: parquet
  save_daily_weights_table: true
  save_integer_share_daily_weights_table: true
  save_integer_share_holdings_table: true
  backtest_artifact_compression: none
  save_best_val_artifacts: false
  postprocess_benchmark_after_fold: false
  postprocess_benchmark_after_best_val: false
  postprocess_benchmark_split: test
  postprocess_benchmark_activations: identity,softsign,tanh,isru,erf,atan,gd
  postprocess_benchmark_thresholds: 0,0.0001,0.00025,0.0005,0.001,0.0025,0.005,0.01,0.02
  postprocess_benchmark_rank_metric: cumulative_return
  postprocess_benchmark_plot_metrics: sharpe,sortino,cumulative_return
  postprocess_benchmark_plot_top_n: 20
  postprocess_benchmark_backtest_compile: false
  postprocess_benchmark_max_rows: 0
  postprocess_benchmark_strict: false
  cache_train_tensors_on_gpu: true
  cache_eval_tensors_on_gpu: true
  learning_rate: 0.0003
  enable_lr_scheduler: true
  lr_scheduler: warmup_cosine
  lr_scheduler_t_max: 0
  lr_scheduler_eta_min: 0.00001
  lr_scheduler_warmup_steps: 500
  lr_scheduler_step_size: 50
  lr_scheduler_gamma: 0.5
  lr_scheduler_patience: 4
  lr_scheduler_threshold: 0.0005
  weight_decay: 0.01
  # Global gradient-norm clipping for optimizer stability. 0 disables it.
  grad_clip_norm: 0.0
  finite_check_interval_steps: 100
  checkpoint_finite_check: false
  loss_type: log_utility
  min_batch_size: 1
  auto_batch_size: false
  vram_budget_gb: 32
  vram_safety_margin_gb: 2.0
  target_vram_fraction: 0.9
  # Model branches. Only the block named by training.model_name is active.
  # Current active branch: transformer_base_portfolio.
  mlp:
    hidden_dim: 1024
    hidden_layers: 2
    embedding_dim: 64
    dropout: 0.1
  ft_transformer:
    d_token: 64
    n_layers: 2
    n_heads: 4
    ffn_dim: 256
    dropout: 0.1
    use_cls_token: true
  tabular_resnet:
    embedding_dim: 128
    hidden_dim: 256
    n_blocks: 4
    dropout: 0.1
  multi_stock_tcn:
    hidden_channels: 16
    embedding_dim: 16
    tcn_blocks: 4
    tcn_kernel_size: 3
    head_hidden_dim: 16
    head_layers: 1
    dropout: 0.1
    tcn_conv_mode: separable
    conv_layers_per_block: 1
    norm_type: none
    sanitize_inputs: false
  efficient_tcn_tabular_set_portfolio:
    temporal_enabled: true
    temporal_dim: 16
    temporal_hidden_channels: 32
    temporal_dilations: [1, 2]
    temporal_kernel_size: 3
    tabular_dim: 64
    tabular_hidden_dim: 128
    tabular_blocks: 2
    model_dim: 64
    set_enabled: true
    num_inducing_points: 16
    num_heads: 4
    ffn_mult: 2
    head_hidden_dim: 64
    head_layers: 1
    dropout: 0.1
    residual_scale: 0.5
    default_temperature: 1.0
    portfolio_mode: long_only
    return_aux: true
  latent_factor_market_token_portfolio:
    temporal_enabled: true
    temporal_dim: 16
    temporal_hidden_channels: 32
    temporal_dilations: [1, 2]
    temporal_kernel_size: 3
    tabular_dim: 64
    tabular_hidden_dim: 128
    tabular_blocks: 2
    stock_embedding_dim: 64
    num_latent_factors: 32
    num_market_tokens: 4
    num_heads: 4
    ffn_mult: 2
    head_hidden_dim: 64
    head_layers: 1
    dropout: 0.3
    residual_scale: 0.5
    default_temperature: 1.0
    portfolio_mode: long_only
    return_aux: true
  low_rank_market_transformer_portfolio:
    feature_dim: 32
    temporal_mixer: conv
    temporal_layers: 4
    temporal_heads: 2
    temporal_ffn_dim: 64
    temporal_dropout: 0.1
    temporal_pooling: attention
    temporal_kernel_size: 3
    temporal_dilations: [1, 2, 4, 8]
    temporal_checkpoint: false
    stock_embedding_dim: 32
    num_latent_factors: 8
    num_market_tokens: 4
    cross_heads: 2
    cross_ffn_mult: 1
    head_hidden_dim: 32
    head_layers: 1
    dropout: 0.1
    default_temperature: 1.0
    portfolio_mode: long_short
    return_aux: true
    return_aux_details: false
  # Active model branch for this experiment.
  transformer_base_portfolio:
    d_model: 64
    # full: most complete O((lookback*stocks)^2), small universes only
    # axial: temporal + cross-stock attention O(S*L^2 + L*S^2)
    # latent: temporal + latent factors + market tokens, large universe friendly
    # market_token: temporal + market tokens, smallest cross-stock transformer
    # temporal_only: no cross-stock attention
    attention_mode: market_token
    use_flash_attention: true
    use_time_pos: true
    use_symbol_pos: true
    input_dropout: 0.0
    # Fold18 full-TW benchmark: 65535 is the largest stable SDPA chunk in the
    # current CUDA/PyTorch environment. 65536 and 131071 both failed in SDPA
    # forward with CUDA invalid argument, so this is a kernel shape boundary,
    # not a VRAM limit.
    sdpa_batch_limit: 65535
    norm_type: rmsnorm
    ffn_type: swiglu
    qk_norm: true
    rope_temporal: true
    rope_base: 10000.0
    # Keep dynamic market tokens plus attention pooling/full_then_last. Fold18
    # two-epoch benchmark, using epoch 2 only: temporal_layers=1,
    # temporal_heads=1, temporal_ffn_mult=1, d_model=16, cross_heads=2, and
    # eval_model_chunk_rows=auto reduced epoch wall from 20.16s to 4.93s while
    # preserving attention pooling semantics. Adding train_symbol_compaction:
    # train_union then reduced epoch-2 wall to 3.72s and train time to
    # 175.1ms/batch on fold18 by training only the fold's active symbol union.
    # d_model=8 was faster at 3.35s but collapsed the 2-epoch fold18
    # validation/test loss, so it is only a lower bound probe, not active.
    temporal_layers: 2
    temporal_heads: 4
    temporal_ffn_mult: 2
    temporal_pooling: last
    temporal_query_mode: last_only
    cross_layers: 1
    cross_heads: 4
    cross_ffn_mult: 2
    joint_layers: 2
    joint_heads: 4
    joint_ffn_mult: 2
    latent_layers: 1
    num_latent_factors: 16
    num_market_tokens: 16
    market_layers: 2
    head_hidden_dim: 64
    head_layers: 1
    dropout: 0.0
    default_temperature: 1
    portfolio_mode: long_short
    # true keeps the legacy near-dollar-neutral logits; false allows directional net exposure.
    center_long_short_logits: false
    # portfolio_output_mode design:
    # - activation_l1: legacy activated scores -> full-gross L1 weights; good baseline, dense.
    # - l1: raw centered scores -> full-gross L1 weights; strongest dense gradient among normalized modes.
    # - logits: raw centered logits; pair trading/loss portfolio_activation=identity so backtest/loss normalizes.
    # - signed_softmax: dense long/short/cash action simplex; legal cash, but weakest gradient for large S.
    # - signed_entmax15: sparse-ish long/short/cash action simplex; recommended when large-S softmax gradients are too small.
    # - signed_sparsemax: hardest sparse long/short/cash simplex; largest local gradients, more support-jump risk.
    # - projection_l1: raw holdings projected to L1 ball; legal cash, sparse only when raw gross exceeds 1.
    # For signed_* and projection_l1, keep portfolio_activation/loss_portfolio_activation=pre_normalized.
    portfolio_output_mode: projection_l1
    max_full_tokens: 16384
    checkpoint_blocks: false
    return_aux: false
    return_aux_details: false
    # Categorical features are embedded by name only when the feature is enabled above.
    categorical_feature_names:
      - twpub_company_industry_code
      - twpub_company_is_foreign
      - twpub_company_has_preferred_stock
    categorical_embedding_dim: 4
    categorical_embedding_cardinality: 512
    # return_aux_details returns attention/factor internals; keep false for training speed.
  # Gradient Boosted Portfolio Transformer.
  # To run this branch safely, use a fresh output_dir or set resume=false before
  # changing training.model_name to gradient_boosted_portfolio_transformer.
  gradient_boosted_portfolio_transformer:
    d_model: 32
    temporal_layers: 2
    temporal_heads: 4
    temporal_ffn_mult: 2
    market_layers: 1
    market_heads: 4
    market_ffn_mult: 2
    num_market_tokens: 4
    head_hidden_dim: 32
    head_layers: 1
    dropout: 0.0
    input_dropout: 0.0
    use_time_pos: true
    use_symbol_pos: false
    dynamic_market_tokens: true
    dynamic_token_gate_init: 0.1
    num_residual_stages: 2
    stage_eta: [0.5, 0.25]
    trainable_eta: true
    eta_max: 1.0
    detach_stage_condition: true
    default_temperature: 1.0
    portfolio_mode: long_short
    portfolio_output_mode: logits
    center_final_logits: true
    return_aux: false
    return_aux_details: false
  bottleneck_portfolio_autoencoder:
    d_model: 64
    z_dim: 32
    temporal_type: tcn
    temporal_layers: 2
    asset_encoder_type: lite_isab
    asset_encoder_layers: 1
    n_heads: 4
    num_inducing_points: 32
    ffn_mult: 2
    dropout: 0.1
    long_short: true
    noise_std: 0.01
    return_aux: false
  tcn_hybrid_tabular_resnet:
    embedding_dim: 64
    encoder_hidden_dim: 128
    encoder_blocks: 2
    tcn_blocks: 2
    tcn_kernel_size: 3
    dropout: 0.3
  temporal_tabular_resnet:
    temporal_hidden_dim: 128
    temporal_layers: 1
    temporal_dropout: 0.3
    embedding_dim: 128
    hidden_dim: 256
    n_blocks: 4
    dropout: 0.1
  cross_sectional_temporal_portfolio_model:
    candidate_k: 64
    trade_k: 10
    scorer_hidden: 128
    scorer_blocks: 2
    d_model: 128
    heads: 4
    layers: 2
    dropout: 0.15
    regime_classes: 3
  multitask_loss:
    rank_ic_weight: 1.00
    direction_weight: 0.00
    volatility_regime_weight: 0.00
    # Soft portfolio concentration penalty. 0 disables it.
    concentration_weight: 0.0
    # Soft penalty on realised (long - short) exposure. 0 disables it.
    net_exposure_weight: 0.0
    regime_up_threshold: 0.002
    regime_down_threshold: -0.002
  factor_generalization_loss:
    slope_tstat_weight: 1.0
    rank_ic_weight: 0.5
    factor_sharpe_weight: 0.25
    block_stability_weight: 0.20
    regime_stability_weight: 0.20
    consistency_weight: 0.05
    net_exposure_weight: 0.0
    gross_exposure_weight: 0.0
    concentration_weight: 0.0
    turnover_weight: 0.0
    score_l2_weight: 0.0
    factor_temperature: 1.0
    block_count: 4
    worst_fraction: 0.25
    augmentation_feature_dropout: 0.10
