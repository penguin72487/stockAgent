# Opt-in broad research experiment. Current revised macro values and estimated
# XBRL filing dates are accepted; this is not an immutable historical-vintage
# backtest and must never replace the strict/live TW public feature table.
base_config: tw_public_preopen_raw_2014_v1.yaml
experiment_name: tw-public-preopen-wide-research-2014-v1

runner:
  output_dir: artifacts/markets/tw_public_preopen_wide_research_2014_v1
  resume: false
  post_train_infer: false

data:
  tw_public_feature_path: data_tw_public/features/tw_public_research_wide_2014_v1.parquet
  panel_start_date: "2014-01-01"
  feature_include:
    - open_raw
    - high_raw
    - low_raw
    - close_raw
    - trading_volume_raw
    - twpub_official_trading_value_raw
    - twpub_official_trades_raw
    - twpub_pe_raw
    - twpub_pb_raw
    - twpub_dividend_yield_pct_raw
    - twpub_dividend_per_share_raw
    - twpub_margin_balance_lots_raw
    - twpub_short_balance_lots_raw
    - twpub_margin_buy_lots_raw
    - twpub_margin_sell_lots_raw
    - twpub_short_sell_lots_raw
    - twpub_short_buy_lots_raw
    - twpub_foreign_net_buy_shares_raw
    - twpub_investment_trust_net_buy_shares_raw
    - twpub_dealer_net_buy_shares_raw
    - twpub_institutional_net_buy_shares_raw
    - twpub_official_turnover_ratio
    - twpub_official_intraday_range
    - twpub_official_close_to_high
    - twpub_official_close_to_low
    - twpub_dividend_yield
    - twpub_attention_event_flag
    - twpub_attention_source_covered
    - twpub_disposal_event_flag
    - twpub_disposal_source_covered
    - twpub_twse_taiex_raw
    - twpub_twse_taiex_pct
    - twpub_usdtwd_raw
    - twpub_cbc_overnight_pct_raw
    - twpub_cbc_fx_reserves_usd_billion_raw
    - twpub_cbc_m1b_raw
    - twpub_cbc_m1b_yoy_pct_raw
    - twpub_cbc_m1b_yoy
    - twpub_cbc_m2_raw
    - twpub_cbc_m2_yoy_pct_raw
    - twpub_cbc_m2_yoy
    - twpub_dgbas_cpi_raw
    - twpub_dgbas_cpi_yoy_pct_raw
    - twpub_dgbas_cpi_yoy
    - twpub_dgbas_unemployment_pct_raw
    - twpub_dgbas_unemployment_rate
    - twpub_dgbas_gdp_raw
    - twpub_dgbas_gdp_yoy_pct_raw
    - twpub_dgbas_gdp_yoy
    - twpub_mof_export_raw
    - twpub_mof_import_raw
    - twpub_mof_trade_balance_raw
    - twpub_mof_tax_total_raw
    - twpub_mof_securities_tax_raw
    - twpub_mof_futures_tax_raw
    - twpub_mof_business_tax_raw
    - twpub_xbrl_assets_twd_raw
    - twpub_xbrl_liabilities_twd_raw
    - twpub_xbrl_equity_twd_raw
    - twpub_xbrl_cash_twd_raw
    - twpub_xbrl_current_assets_twd_raw
    - twpub_xbrl_current_liabilities_twd_raw
    - twpub_xbrl_inventories_twd_raw
    - twpub_xbrl_revenue_twd_quarter_raw
    - twpub_xbrl_revenue_twd_ytd_raw
    - twpub_xbrl_profit_twd_quarter_raw
    - twpub_xbrl_profit_twd_ytd_raw
    - twpub_xbrl_gross_profit_twd_quarter_raw
    - twpub_xbrl_gross_profit_twd_ytd_raw
    - twpub_xbrl_operating_profit_twd_quarter_raw
    - twpub_xbrl_operating_profit_twd_ytd_raw
    - twpub_xbrl_basic_eps_quarter_raw
    - twpub_xbrl_basic_eps_ytd_raw
    - twpub_xbrl_operating_cash_flow_twd_quarter_raw
    - twpub_xbrl_operating_cash_flow_twd_ytd_raw
    - twpub_xbrl_debt_ratio
    - twpub_xbrl_equity_ratio
    - twpub_xbrl_current_ratio
    - twpub_xbrl_inventory_to_assets_ratio
    - twpub_xbrl_gross_margin
    - twpub_xbrl_operating_margin
    - twpub_xbrl_net_margin
    - twpub_xbrl_tifrs_operating_revenue_twd_quarter_raw
    - twpub_xbrl_tifrs_operating_revenue_twd_ytd_raw
    - twpub_xbrl_tifrs_gross_profit_twd_quarter_raw
    - twpub_xbrl_tifrs_gross_profit_twd_ytd_raw
    - twpub_xbrl_tifrs_net_gross_profit_twd_quarter_raw
    - twpub_xbrl_tifrs_net_gross_profit_twd_ytd_raw
    - twpub_xbrl_tifrs_net_operating_income_twd_quarter_raw
    - twpub_xbrl_tifrs_net_operating_income_twd_ytd_raw
    - twpub_xbrl_tifrs_gross_margin
    - twpub_xbrl_tifrs_net_gross_margin
    - twpub_xbrl_tifrs_operating_margin
  # Carry only state-like released data; one-day trading flows and event counts
  # remain events. These flags tell the model a true zero from an unavailable
  # source, before the panel's final NaN-to-zero tensor conversion.
  feature_availability_indicators:
    - twpub_xbrl_*
    - twpub_cbc_m1b_raw
    - twpub_cbc_m2_raw
    - twpub_dgbas_cpi_raw
    - twpub_dgbas_gdp_raw
    - twpub_mof_*_raw
    - twpub_pe_raw
    - twpub_pb_raw
  feature_shift_next_session:
    - open_raw
    - high_raw
    - low_raw
    - close_raw
    - trading_volume_raw
    - twpub_official_trading_value_raw
    - twpub_official_trades_raw
    - twpub_pe_raw
    - twpub_pb_raw
    - twpub_dividend_yield_pct_raw
    - twpub_dividend_per_share_raw
    - twpub_official_turnover_ratio
    - twpub_official_intraday_range
    - twpub_official_close_to_high
    - twpub_official_close_to_low
    - twpub_dividend_yield
    - twpub_twse_taiex_raw
    - twpub_twse_taiex_pct

training:
  # The panel retains original units. Scaling is fitted on training years only,
  # preserves true zero and disables features unseen in a fold's training set.
  model_name: financial_transformer
  financial_transformer:
    causal_feature_rms_normalization: true
    causal_feature_min_active_dates: 2
    categorical_feature_names: []

walk_forward:
  expected_first_year: 2014
