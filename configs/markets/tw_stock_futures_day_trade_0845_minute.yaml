  # One daily action; the canonical loss owns scheduled integer executions.
  compile_loss: false
  # The scheduled contract runs through the existing eager integer adapter.
  backtest_compile: false
  eval_backtest_compile: false
  cache_train_tensors_on_gpu: false
  cache_eval_tensors_on_gpu: false
