  parquet_root: /srv/stockagent-packed-materialized/tw-public/tw-public-20260906T151104843336596Z-l0-penguin-246aab6e5c72e427/stocks
  tw_public_feature_path: /srv/stockagent-packed-materialized/tw-public/tw-public-20260906T151104843336596Z-l0-penguin-246aab6e5c72e427/features/tw_public_stock_daily.parquet
  # Packed materializations are immutable; panel caches stay node-local.
  panel_cache_root: artifacts/cache/tw_stock_futures_day_trade_0845_minute_panel
  # 08:45 is before the cash-stock auction. Keep every prior-completed feature.
  day_trade_open_feature: false
  feature_exclude:
    - next_session_open_gap_logret

trading:
  execution_mode: tw_stock_futures_day_trade_0845_minute
  tw_stock_futures_day_trade_data_path: /srv/stockagent-packed-materialized/tw-futures/tw-futures-20260907T024404680420085Z-l0-penguin-fb2f3972dafefd96/taifex_portfolio_daily_v4/continuous_daily.parquet
