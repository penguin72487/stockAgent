# Formal Bybit execution strategy with historically reproducible public inputs.
#
# The traded universe, marks, volume capacity, fees and funding settlement stay
# Bybit-only. Information may additionally come from completed Binance/OKX bars,
# FRED initial-release vintages and SEC acceptance timestamps. Families first
# observed locally in 2026 (CoinGecko/CoinMetrics/DeFi/issuer snapshots) remain
# stored but are deliberately absent from the 2020 training ABI.
base_config: bybit_perpetual_daily_0005_historical_pit_learned_cash_trajectory_v3.yaml

experiment_name: bybit-perpetual-daily-0005-historical-public-pit-learned-cash-trajectory-v4

runner:
  output_dir: artifacts/markets/bybit_perpetual_daily_0005_historical_public_pit_learned_cash_trajectory_v4
  resume: true
  post_train_infer: false

data:
  crypto_exchange_scope: bybit
  crypto_information_scope: historical_public_pit
  external_feature_path: data_bybit/public_features/bybit_crypto_public_daily.parquet
  panel_cache_root: artifacts/cache/bybit_perpetual_daily_0005_historical_public_pit_trajectory_v4
  feature_include:
    - open_logret_1d
    - max_logret_1d
