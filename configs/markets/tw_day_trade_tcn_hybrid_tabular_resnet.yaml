base_config: tw_day_trade_model_experiments_common.yaml

experiment_name: tw-day-trade-tcn-hybrid-tabular-resnet-lookback32-v1
runner:
  output_dir: artifacts/model_experiments/tw_day_trade/tcn_hybrid_tabular_resnet

training:
  model_name: tcn_hybrid_tabular_resnet
  lookback: 32
  batch_size_train: 32
  tcn_hybrid_tabular_resnet:
    embedding_dim: 64
    encoder_hidden_dim: 128
    encoder_blocks: 3
    tcn_blocks: 5
    tcn_kernel_size: 3
    dropout: 0.15
