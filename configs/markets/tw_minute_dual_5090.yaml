base_config: tw_public_lanten_market_candles.yaml

experiment_name: tw-full-market-minute-long-short-cost-aware-panel-history-v11

runner:
  # Training-contract v13 preserves the exact proximal candidate instead of
  # re-normalizing away its no-trade band. Preserve the still-running v9 job in
  # its own root; it is not optimizer-compatible with this allocator contract.
  output_dir: artifacts/markets/tw_minute_dual_5090_cost_aware_panel_history_v11
  mode: train
  resume: true
  post_train_infer: false
  start_fold: 1
  # Keep DDP inside each fold, but give every expanding fold a fresh process.
  # A same-process run completed folds 1/2 and then OOMed while Triton loaded
  # fold 3's first backward kernel. An isolated fold-3 batch64/chunk16 smoke
  # completed train+validation+test with the same math and peak shape.
  isolate_train_folds: true

environment:
  device: cuda
  use_tensor_cores: true
  amp_dtype: bf16
  # Keep the candle baseline's dual-EPYC host budget. The NUMA launcher further
  # limits each rank to CPUs local to its assigned RTX 5090.
  cpu_threads: 112
  torch_compile_threads: 16

data:
  # The fresh schema-5 root materializes 10 one-minute fields plus 15 pure-K
  # features rebuilt from the developing current-session candle at every
  # completed minute. The immutable daily panel supplies a causal 32-session
  # history of the remaining 84 fields (83 public/external + observed gaps).
  panel_start_date: "2020-01-01"
  minute_parquet_root: data_tw_minute/research_dataset_developing_v5
  minute_require_research_ready: true
  minute_verify_partition_sha256: true
  # Reporting only: one 2330 adjusted-close (dividend-adjusted) buy-and-hold
  # path from each split's first close through its final close. It is not a
  # daily reset open-to-close strategy and never consumes the next split's row.
  benchmark_name: "2330"
  day_trade_open_feature: true
  minute_daily_context_panel_meta: data_tw_public/stocks/panel_cache_v2/variants/5f5050cb6b7b0738f40f926bd8d9c05a487f82658b717067aebe43021d2ecc16.json
  # Exact-session eligibility/direction plus prior-session official short
  # capacity are loaded once into a compact [day,symbol] sidecar.
  use_tw_public_rules: true
  tw_public_feature_path: data_tw_public/features/tw_public_stock_daily.parquet

walk_forward:
  # Minute partitions begin in 2020. Keep every session strictly chronological;
  # the first owned target may use only already-observed prior panel rows.
  min_train_years: 2
  val_years: 1
  expected_first_year: 2020
  split_start_year: null
  lookback_context: panel_history
  require_contiguous_years: true
  require_future_test_year: false

trading:
  # Daily/tw_day_trade execution fields must not leak into the minute ledger.
  frequency: minute
  execution_mode: tw_minute
  long_only: false
  portfolio_activation: pre_normalized
  min_trade_weight: 0.0
  reporting_leverage: 1.0
  # Correct effective stock day-trade scalar. Runtime execution uses the same
  # per-security schedule as ordinary tw_day_trade: stock sell 0.1785%, ETF
  # sell 0.1285%, and buy 0.0285% for both.
  buy_fee_rate: 0.000285
  sell_fee_rate: 0.001785
  # Cash and every signed stock score share one L1 action budget. This remains
  # the maximum gross-risk ceiling; the learned cash score decides how much of
  # it stays in cash before eligibility and capacity masks are applied.
  max_volume_participation: 0.50
  tw_minute_initial_equity: 10000000.0
  tw_minute_gross_exposure: 1.0
  tw_minute_max_name_weight: null
  tw_minute_outside_cash_logit: null
  tw_minute_max_order_notional: null
  tw_minute_slippage_bps_per_side: 0.0
  tw_minute_first_decision_minute: 1
  tw_minute_last_entry_minute: 268
  tw_minute_last_decision_minute: 269
  tw_minute_force_session_close: true

training:
  # Everything below that is not minute/DDP capacity-specific is inherited
  # from tw_public_lanten_market_candles.yaml, including 1000 epochs, no LR
  # scheduler, scanner-free hot path, BF16 compile settings, and optimizer.
  model_name: financial_transformer
  multi_gpu_strategy: distributed_data_parallel
  lookback: 32
  # Dual-5090 fold-1 throughput sweep (epoch 2, complete train + validation):
  # global batch 8/16/32/64 -> 30.53/28.60/28.15/27.02 seconds. Batch 128
  # with chunk 8 tied at 27.02 seconds but consumed 31.5/32.6 GiB per GPU.
  # Fold 1 has 456 train sessions, so its nominal batch 64 was balanced into
  # eight actual 57-session batches and never tested the full capacity. Fold 2
  # is the first group that forms 64 sessions: per rank 32 days * chunk 16 =
  # 512 compiled rows, which measured 30.46 GiB allocated and OOMed on the next
  # 226 MiB buffer. Keep chunk 16 and prevent the much larger BF16 candle
  # residual from being promoted back to FP32 when positional tensors are
  # added; this preserves the optimizer/chunk schedule and creates real VRAM
  # headroom instead of merely squeezing below the allocator limit.
  # After stacked host-batch caching, scanner-free chunk math, and one DDP
  # reduction per optimizer step, the signed long/short path measured 24.061s.
  batch_size_train: 64
  batch_size_eval: 16
  minute_decision_chunk_rows: 16
  minute_eval_decision_chunk_rows: 16
  # Keep the recurrent graph through all 16-row compile chunks so later
  # turnover and forced-close fees reach the earlier actions that caused them.
  minute_full_day_credit_assignment: true
  # Retain the exact full-day graph while recomputing policy activations in
  # backward; this avoids storing 15 chunks of Transformer intermediates.
  minute_full_day_activation_checkpoint: true
  # The encoder proposes alpha targets in parallel; the sequential executor
  # applies each proposal relative to the actual filled previous portfolio.
  # 1.0 is 2^0 and uses the exact applicable one-way fee as the proximal
  # no-trade threshold.
  minute_stateful_proximal_allocator: true
  minute_proximal_cost_multiplier: 1.0
  minute_cache_days_on_cpu: true
  minute_cpu_cache_gb: 64.0
  minute_data_workers: 8
  # The first model matmul already consumes BF16 under autocast. Store only
  # immutable model features (minute and daily context) in that same dtype;
  # prices, volume, fees, positions, NAV, and report reductions remain FP32.
  # This makes Fold 4 train+validation+test fit in each rank's 64 GiB cache and
  # halves the dominant host-to-device feature payload.
  cache_train_features_in_amp_dtype: true
  loss_type: log_utility
  loss_portfolio_activation: pre_normalized
  strict_no_fallback: true
  allow_dynamic_symbols: false
  # Keep the shared Transformer-family contract aligned even though this run
  # selects financial_transformer as its active model.
  transformer_base_portfolio:
    amp_native_position_add: true
    checkpoint_blocks: true
    portfolio_output_mode: cash_l1
    center_long_short_logits: false
  financial_transformer:
    # Add one contextual cash token to the stock score vector and normalize
    # [signed stocks, positive cash] jointly. Cash is a model action, not the
    # residual of failed or capacity-limited orders.
    # Under BF16 autocast, cast the small position tensors to the activation
    # dtype instead of promoting the full [B,L,S,D] residual back to FP32.
    amp_native_position_add: true
    # Fold-4 A/B confirmed this remains necessary even though the executor also
    # checkpoints complete policy chunks: disabling it reached 30.5 GiB before
    # Triton requested its final 96-226 MiB autotune buffers and OOMed.
    checkpoint_blocks: true
    # Separate clocks: completed 32-day public/daily history and completed
    # 32-minute developing-candle history are encoded independently, then fused.
    daily_context_lookback: 32
    daily_context_layers: 2
    daily_context_pooling: last
    portfolio_mode: long_short
    portfolio_output_mode: cash_l1
    # Preserve raw signed score direction. Do not force cross-sectional dollar
    # neutrality by subtracting the market mean before L1 normalization.
    center_long_short_logits: false
    return_aux: false
    return_aux_details: false
  # Rank 0 refreshes both live curves after every complete epoch.
  # Test loss is audit-only and uses the first calendar year in this fold's
  # test interval (fold 1: 2023), never the later test years.
  epoch_test_curve: true
  curve_test_interval: 1
  curve_plot_interval: 1
  curve_plot_async: true
  defer_epoch_curve_plot_until_end: false
