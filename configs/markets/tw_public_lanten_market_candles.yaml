experiment_name: tw-financial-transformer-candles-snapshot-safe99-open-aware-gross-tw-cash-lookback32-panel-history-v1-dual5090

runner:
  # The causal current-open channel creates a 99-slot schema and therefore a
  # fresh checkpoint root, incompatible with the earlier 98-slot model.
  output_dir: artifacts/markets/tw_public_candles_tw_day_trade_lookback32
  mode: train
  # Keep all older artifacts for audit, but never resume their optimizer state
  # into this fresh root. Later interruptions within this 99-slot run remain
  # resumable here.
  resume: true
  post_train_infer: true
  # Target-owning folds still begin in 2014; 2012-2013 are context-only rows.
  start_fold: 1
environment:
  device: cuda
  use_tensor_cores: true
  amp_dtype: bf16
  # Dual RTX 5090 / dual EPYC 7663 host-wide budgets. Use the 112 physical
  # cores for PyTorch/BLAS work; DDP divides this into 56 threads per rank.
  # Leaving SMT siblings idle avoids oversubscription across the 224 logical
  # CPUs. Keep Inductor at 8 workers per rank (16 host-wide) to protect the
  # shared compile cache and filesystem.
  cpu_threads: 112
  torch_compile_threads: 16

data:
  # Canonical rows prefer TWSE/TPEx; audited Yahoo rows only fill missing 2000+ OHLCV.
  # Run downloader/download_tw_official_data.py before training.
  parquet_root: data_tw_public/stocks
  # Load two extra calendar years so the first 2014 target has at least 256
  # prior exchange sessions. walk_forward.split_start_year prevents these
  # context-only rows from becoming train/validation/test targets.
  panel_start_date: "2012-01-01"
  # Row t-1 receives log(open[t] / close[t-1]). Thus both phase heads may use
  # the observed current opening print without seeing any session-t
  # high/low/close/full-day-volume field.
  day_trade_open_feature: true
  # Reporting comparator: 2330 adjusted-close buy-and-hold on the panel's
  # close-to-close clock. This is only the benchmark clock: tw_cash strategy
  # actions may execute independently at the opening and closing auctions.
  benchmark_name: "2330"
  usd_only_trading_pairs: false
  panel_backend: auto
  # Rank 0 builds the panel before the DDP cache barrier, so it can use all
  # physical cores without competing with a second materialization.
  panel_load_workers: 112
  trading_volume_policy: required
  tradable_mode: tw_limit_guard
  use_tw_public_features: true
  use_tw_public_rules: true
  tw_public_feature_path: data_tw_public/features/tw_public_stock_daily.parquet
  tw_public_market_symbol: "__MARKET__"
  # Use every engineered base and non-snapshot TW-public feature. Each external value is
  # overlaid only on its point-in-time availability date; state-like features
  # are forward-filled from their first known observation. Before first
  # availability (and for unresolved missing cells), panel construction fills
  # the value with 0 instead of deleting the entire feature family.
  feature_include:
    # Base price log returns
    - open_logret_1d
    - max_logret_1d
    - min_logret_1d
    - close_logret_1d

    # Base volume and signed volume
    - trading_volume_logret_1d
    - signed_vol

    # Base candlestick body, close location, and shadows
    - body_ratio
    - signed_body_ratio
    - delta_body_ratio
    - clv
    - clv_centered
    - delta_clv
    - upper_shadow
    - lower_shadow
    - shadow_imbalance

    # Official TWSE/TPEx daily price and liquidity
    - twpub_official_close_logret_1d
    - twpub_official_trading_volume_log
    - twpub_official_trading_value_log
    - twpub_official_trades_log
    - twpub_official_turnover_ratio
    - twpub_official_intraday_range
    - twpub_official_close_to_high
    - twpub_official_close_to_low

    # Valuation and dividend yield
    - twpub_pe_log
    - twpub_pb_log
    - twpub_dividend_yield
    - twpub_dividend_per_share_log

    # Margin financing and short balances/flows
    - twpub_margin_balance_log
    - twpub_margin_balance_chg
    - twpub_short_balance_log
    - twpub_short_balance_chg
    - twpub_margin_buy_flow
    - twpub_margin_sell_flow
    - twpub_short_sell_flow
    - twpub_short_buy_flow

    # Institutional trading flows
    - twpub_foreign_net_buy_flow
    - twpub_investment_trust_net_buy_flow
    - twpub_dealer_net_buy_flow
    - twpub_institutional_net_buy_flow

    # TDCC shareholding distribution
    # - twpub_tdcc_retail_holder_ratio  # permanently disabled: snapshot-only
    # - twpub_tdcc_large_holder_ratio  # permanently disabled: snapshot-only
    # - twpub_tdcc_holder_count_log  # permanently disabled: snapshot-only

    # Company profile and categorical identity
    # - twpub_company_paidin_capital_log  # permanently disabled: snapshot-only
    # - twpub_company_issued_shares_log  # permanently disabled: snapshot-only
    # - twpub_company_private_shares_log  # permanently disabled: snapshot-only
    # - twpub_company_age_years  # permanently disabled: snapshot-only
    # - twpub_company_listed_age_years  # permanently disabled: snapshot-only
    # - twpub_company_par_value_log  # permanently disabled: snapshot-only
    # - twpub_company_industry_code  # permanently disabled: snapshot-only
    # - twpub_company_is_foreign  # permanently disabled: snapshot-only
    # - twpub_company_has_preferred_stock  # permanently disabled: snapshot-only

    # Dividend announcements and ex-dividend information
    - twpub_dividend_cash_per_share
    - twpub_dividend_stock_per_share
    - twpub_dividend_total_cash_log
    - twpub_dividend_total_stock_log
    - twpub_dividend_confirmed
    - twpub_dividend_board_approved
    - twpub_exdiv_known
    - twpub_exdiv_cash_dividend
    - twpub_exdiv_stock_dividend_ratio
    - twpub_exdiv_subscription_ratio
    - twpub_exdiv_subscription_price_log

    # Material events, attention stocks, and disposal stocks
    - twpub_material_event_count_log
    - twpub_material_clause_log
    - twpub_material_fact_lag_days
    - twpub_attention_count_log
    - twpub_attention_close_log
    - twpub_attention_pe_log
    - twpub_disposal_count_log

    # Point-in-time monthly revenue
    # - twpub_monthly_revenue_log  # permanently disabled: snapshot-only
    # - twpub_monthly_revenue_mom  # permanently disabled: snapshot-only
    # - twpub_monthly_revenue_yoy  # permanently disabled: snapshot-only
    # - twpub_cumulative_revenue_yoy  # permanently disabled: snapshot-only

    # Point-in-time income statement and balance sheet
    # - twpub_financial_eps  # permanently disabled: snapshot-only
    # - twpub_financial_revenue_log  # permanently disabled: snapshot-only
    # - twpub_financial_net_income_asinh  # permanently disabled: snapshot-only
    # - twpub_financial_gross_margin  # permanently disabled: snapshot-only
    # - twpub_financial_operating_margin  # permanently disabled: snapshot-only
    # - twpub_financial_net_margin  # permanently disabled: snapshot-only
    # - twpub_financial_assets_log  # permanently disabled: snapshot-only
    # - twpub_financial_debt_ratio  # permanently disabled: snapshot-only
    # - twpub_financial_current_ratio  # permanently disabled: snapshot-only
    # - twpub_financial_equity_ratio  # permanently disabled: snapshot-only
    # - twpub_financial_book_value_per_share_log  # permanently disabled: snapshot-only

    # Insider ownership and announced transfers
    # - twpub_insider_holdings_log  # permanently disabled: snapshot-only
    # - twpub_insider_pledge_ratio  # permanently disabled: snapshot-only
    # - twpub_insider_transfer_shares_log  # permanently disabled: snapshot-only

    # Securities borrowing and short-sale availability
    # - twpub_borrow_available_log  # permanently disabled: snapshot-only
    # - twpub_sbl_balance_log  # permanently disabled: snapshot-only
    # - twpub_short_sale_available_log  # permanently disabled: snapshot-only

    # TAIEX and USD/TWD market state
    - twpub_twse_taiex_log
    - twpub_twse_taiex_logret_1d
    - twpub_twse_taiex_pct
    - twpub_usdtwd_log
    - twpub_usdtwd_logret_1d

    # Central Bank of Taiwan monetary data
    - twpub_cbc_overnight_rate
    - twpub_cbc_overnight_rate_chg
    - twpub_cbc_fx_reserves_log
    - twpub_cbc_fx_reserves_chg
    - twpub_cbc_m1b_log
    - twpub_cbc_m1b_yoy
    - twpub_cbc_m2_log
    - twpub_cbc_m2_yoy

    # DGBAS macroeconomic data
    - twpub_dgbas_cpi_log
    - twpub_dgbas_cpi_yoy
    - twpub_dgbas_unemployment_rate
    - twpub_dgbas_gdp_log
    - twpub_dgbas_gdp_yoy

    # Ministry of Finance trade and tax data
    - twpub_mof_export_log
    - twpub_mof_import_log
    - twpub_mof_trade_balance_asinh
    - twpub_mof_tax_total_log
    - twpub_mof_securities_tax_log
    - twpub_mof_futures_tax_log
    - twpub_mof_business_tax_log

    # TAIFEX futures and options market activity
    - twpub_taifex_tx_volume_log
    - twpub_taifex_tx_open_interest_log
    - twpub_taifex_tx_settlement_logret_1d
    - twpub_taifex_txo_call_volume_log
    - twpub_taifex_txo_put_volume_log
    - twpub_taifex_txo_put_call_volume_ratio
    - twpub_taifex_txo_call_oi_log
    - twpub_taifex_txo_put_oi_log
    - twpub_taifex_txo_put_call_oi_ratio
    - twpub_taifex_dealer_net_oi_asinh
    - twpub_taifex_foreign_net_oi_asinh
    - twpub_taifex_trust_net_oi_asinh
    - twpub_taifex_tx_top5_long_ratio
    - twpub_taifex_tx_top10_long_ratio
    - twpub_taifex_tx_large_oi_log
    - twpub_taifex_tx_final_settlement_logret
  feature_exclude: []
  feature_zero_fill: []
  # tradable_mode: tradable

walk_forward:
  min_train_years: 1
  val_years: 1
  # Panel coverage begins in 2012, but fold IDs and target ownership begin in
  # 2014. The first day of every owned year is therefore local row 0.
  expected_first_year: 2012
  split_start_year: 2014
  lookback_context: panel_history
  require_contiguous_years: true
  # false adds an experimental final fold where the latest year is both val and test.
  require_future_test_year: false


trading:
  frequency: daily
  # The receipt-verified MOPS entitlement archive is incomplete, and avoid-mode
  # mandatory covers are not executable on every historical action date. Use
  # the research-only executor instead of fabricating exact cash entitlements.
  execution_mode: tw_day_trade
  tw_corporate_action_mode: avoid
  tw_short_capacity_limit_enabled: false
  tw_corporate_action_claim_queue_sessions: 256
  buy_fee_rate: 0.000291
  sell_fee_rate: 0.003291
  max_turnover_ratio: 0.0
  max_volume_participation: 0.5
  volume_participation_equity: 10000000.0
  reporting_leverage: 1.0
  min_trade_weight: 0.0
  portfolio_activation: pre_normalized
  # Positive targets are cash longs; negative targets are point-in-time
  # eligibility-constrained margin shorts (融券), never naked negative shares.
  long_only: false
  tw_short_lot_size: 1000
  tw_short_initial_margin_rate: 0.9
  tw_short_maintenance_ratio: 1.3
  tw_short_handling_fee_rate: 0.0
  # No broker-specific historical borrow inventory is available for this run.
  # Keep official eligibility/bans/covers, but do not cap eligible short size.
training:
  financial_transformer:
    # All raw candle features are jointly encoded directly into the model's
    # single 32-dimensional candle vector.
    d_model: 32
    candle_dropout: 0.0
    # sum(abs(long and short weights)) = 1 for every nonzero portfolio row.
    portfolio_output_mode: l1
  non_blocking_transfer: true
  model_name: financial_transformer
  multi_gpu_strategy: auto
  enable_torch_compile: true
  auto_torch_compile_sharpe: false
  torch_compile_mode: reduce-overhead
  torchinductor_cache_dir: ~/.cache/torchinductor
  triton_cache_dir: ~/.cache/triton
  cuda_cache_path: ~/.cache/nv_cuda
  compile_loss: true
  # Fold20 already uses 94.5% of the full universe. The actual dynamic-S A/B
  # made epoch 1 take 182s without new codegen versus 13.75s for fixed S=2735,
  # so train/val/test keep one static full-market ABI across fold20/21.
  compile_model_dynamic_symbols: false
  compile_loss_dynamic_symbols: false
  # Compile exactly one reverse-mode horizon per call. On the actual fixed-S
  # fold20 A/B, rows=32 reduced steady epoch wall from 16.42s to 13.75s versus
  # rows=4. Cold codegen is intentionally heavier but occurs only at warmup.
  tw_continuous_compile_chunk_rows: 32
  # The forward T+2 ledger stays continuous for every session. Only its
  # reverse-mode state is restarted every 32 rows, preventing normalized-ledger
  # gradient overflow while keeping batch128 model/optimizer throughput.
  tw_continuous_gradient_horizon_rows: 32
  loss_portfolio_activation: pre_normalized
  warm_start_from_previous_fold: false
  chunk_rows: 0
  # Lookback256 validation with 64-row chunks peaked at 30.71GiB/rank and OOMed
  # in temporal RoPE on dual RTX 5090. Keep the measured-safe power-of-two shape.
  eval_model_chunk_rows: 32
  # Validation/test run every epoch, so amortize a distinct inference-mode
  # fixed-shape graph instead of paying the eager model cost 2,000 times.
  compile_eval_model: true
  eval_backtest_chunk_rows: 512
  eval_backtest_chunk_rows_auto: true
  # Repeated epoch metrics use the fixed padded eval graph. The one-shot final
  # full weights-history artifact is forced through the identical eager
  # recurrence so it never creates a non-amortizable output-ABI graph.
  eval_backtest_compile: true
  eval_auto_chunk_rows_cap: 32
  # Fixed full width eliminates the duplicate 6.7GB compact train base, shares
  # one immutable base with val/test, and makes fold20/fold21 graph-identical.
  train_symbol_compaction: none
  train_symbol_compaction_bucket_size: 0
  backtest_autotune: true
  backtest_compile: true
  backtest_compile_stateful: true
  backtest_compile_dynamic: false
  inference_backtest_autotune: false
  inference_backtest_compile: false
  backtest_verbose: false
  strict_no_fallback: true
  backtest_checkpoint_chunk_rows: 0
  runtime_shape_check: false
  allow_dynamic_symbols: false
  # tw_cash consumes close-complete rows through t-1, with only the dedicated
  # final-row opening-gap channel augmented by open[t]. It reads exactly the
  # 32 prior panel sessions, including prior years, without importing their
  # returns or settlement state into the owned split.
  lookback: 32
  # With two DDP ranks, global batch128 gives each RTX 5090 a power-of-two
  # local batch64. Re-profile epoch 2+ throughput and VRAM if lookback or the
  # 99-feature schema changes.
  batch_size_train: 128
  batch_size_eval: 128
  epochs: 1000
  early_stopping_no_improve_ratio: 0.1
  val_interval_epochs: 1
  curve_test_interval: 1
  record_epoch_curve: true
  curve_plot_interval: 1
  curve_plot_async: true
  plot_backend: auto
  epoch_test_curve: true
  defer_epoch_curve_plot_until_end: false
  explain_after_each_fold: false
  explain_top_k: 20
  explain_max_rows: 32
  explain_ig_steps: 0
  explain_ig_batch_size: 1
  explain_sample_method: even
  explain_perturb: false
  explain_perturb_batch_size: 1
  explain_perturb_max_auto_batch_size: 1
  explain_perturb_max_input_elements: 8000000
  explain_write_plots: false
  explain_report_style: none
  explain_plot_theme: paper
  explain_standard_plots: false
  explain_interactive_plots: false
  explain_shap_enabled: false
  explain_shap_mode: score_head_surrogate
  explain_case_study_top_k: 5
  explain_regime_analysis: false
  explain_fold_stability: false
  explain_umap_enabled: false
  explain_umap_max_points: 1000
  explain_umap_max_projections: 0
  explain_umap_n_neighbors: 15
  explain_umap_min_dist: 0.1
  explain_cross_asset_enabled: false
  explain_cross_asset_max_sources: 8
  explain_cross_asset_max_targets: 8
  explain_cross_asset_top_edges: 150
  explain_cross_asset_source_chunk_size: 1
  explain_cross_asset_perturb_scale: 1.0
  explain_cross_asset_shocks: [zero, momentum, gap, volume, volatility, liquidity]
  explain_cross_asset_attention_flow: true
  explain_cross_asset_attention_capture_rows: 1
  explain_cross_asset_validated_transmission: true
  explain_cross_asset_role_embedding: false
  explain_cross_asset_graph_backend: cugraph
  explain_cross_asset_graph_benchmark_min_edges: 1000000
  explain_cross_asset_graph_explainability: true
  explain_cross_asset_graph_betweenness_max_vertices: 512
  explain_cross_asset_graph_plot_max_nodes: 80
  table_output_format: parquet
  save_daily_weights_table: true
  save_integer_share_daily_weights_table: true
  save_integer_share_holdings_table: true
  backtest_artifact_compression: none
  save_best_val_artifacts: false
  # The activation/threshold sweep consumes raw transformer_base_portfolio
  # logits and is unsupported by financial_transformer. Avoid repeated no-op
  # subprocess checks during resume and best-validation handling.
  postprocess_benchmark_after_fold: false
  postprocess_benchmark_after_best_val: false
  # Hyperparameter selection belongs to validation. Test-only sweeps may be
  # run as diagnostics, but must never choose deployment settings.
  postprocess_benchmark_split: val
  postprocess_benchmark_activations: identity,softsign,tanh,isru,erf,atan,gd
  postprocess_benchmark_thresholds: 0,0.0001,0.00025,0.0005,0.001,0.0025,0.005,0.01,0.02
  postprocess_benchmark_rank_metric: cumulative_return
  postprocess_benchmark_plot_metrics: sharpe,sortino,cumulative_return
  postprocess_benchmark_plot_top_n: 20
  postprocess_benchmark_backtest_compile: false
  postprocess_benchmark_max_rows: 0
  postprocess_benchmark_strict: false
  cache_train_tensors_on_gpu: true
  cache_eval_tensors_on_gpu: true
  # FinancialTransformer's CandleEncoder deliberately reconstructs FP32 inputs
  # before normalization, so pre-quantizing the immutable feature cache would
  # alter the data contract. Keep FP32 storage and let the shared-base cache
  # make exactly one copy per 32GB RTX 5090 rank.
  cache_train_features_in_amp_dtype: false
  learning_rate: 0.0003
  enable_lr_scheduler: false
  lr_scheduler: warmup_cosine
  lr_scheduler_t_max: 0
  lr_scheduler_eta_min: 0.00001
  lr_scheduler_warmup_steps: 500
  lr_scheduler_step_size: 50
  lr_scheduler_gamma: 0.5
  lr_scheduler_patience: 4
  lr_scheduler_threshold: 0.0005
  weight_decay: 0.01
  grad_clip_norm: 1.0
  # Numerical faults are prevented in the settlement math and bounded
  # recurrence above; do not scan every parameter/gradient in this hot path.
  finite_check_interval_steps: 0
  checkpoint_finite_check: false
  loss_type: log_utility
  min_batch_size: 1
  auto_batch_size: false
  vram_budget_gb: 32
  vram_safety_margin_gb: 1.5
  target_vram_fraction: 0.85
  # Model branches. Only the block named by training.model_name is active.
  # Current active branch: financial_transformer.
  mlp:
    hidden_dim: 1024
    hidden_layers: 2
    embedding_dim: 64
    dropout: 0.1
  ft_transformer:
    d_token: 64
    n_layers: 2
    n_heads: 4
    ffn_dim: 256
    dropout: 0.1
    use_cls_token: true
  tabular_resnet:
    embedding_dim: 128
    hidden_dim: 256
    n_blocks: 4
    dropout: 0.1
  multi_stock_tcn:
    hidden_channels: 16
    embedding_dim: 16
    tcn_blocks: 4
    tcn_kernel_size: 3
    head_hidden_dim: 16
    head_layers: 1
    dropout: 0.1
    tcn_conv_mode: separable
    conv_layers_per_block: 1
    norm_type: none
    sanitize_inputs: false
  efficient_tcn_tabular_set_portfolio:
    temporal_enabled: true
    temporal_dim: 16
    temporal_hidden_channels: 32
    temporal_dilations: [1, 2]
    temporal_kernel_size: 3
    tabular_dim: 64
    tabular_hidden_dim: 128
    tabular_blocks: 2
    model_dim: 64
    set_enabled: true
    num_inducing_points: 16
    num_heads: 4
    ffn_mult: 2
    head_hidden_dim: 64
    head_layers: 1
    dropout: 0.1
    residual_scale: 0.5
    default_temperature: 1.0
    portfolio_mode: long_only
    return_aux: true
  latent_factor_market_token_portfolio:
    temporal_enabled: true
    temporal_dim: 16
    temporal_hidden_channels: 32
    temporal_dilations: [1, 2]
    temporal_kernel_size: 3
    tabular_dim: 64
    tabular_hidden_dim: 128
    tabular_blocks: 2
    stock_embedding_dim: 64
    num_latent_factors: 32
    num_market_tokens: 4
    num_heads: 4
    ffn_mult: 2
    head_hidden_dim: 64
    head_layers: 1
    dropout: 0.3
    residual_scale: 0.5
    default_temperature: 1.0
    portfolio_mode: long_only
    return_aux: true
  low_rank_market_transformer_portfolio:
    feature_dim: 32
    temporal_mixer: conv
    temporal_layers: 4
    temporal_heads: 2
    temporal_ffn_dim: 64
    temporal_dropout: 0.1
    temporal_pooling: attention
    temporal_kernel_size: 3
    temporal_dilations: [1, 2, 4, 8]
    temporal_checkpoint: false
    stock_embedding_dim: 32
    num_latent_factors: 8
    num_market_tokens: 4
    cross_heads: 2
    cross_ffn_mult: 1
    head_hidden_dim: 32
    head_layers: 1
    dropout: 0.1
    default_temperature: 1.0
    portfolio_mode: long_short
    return_aux: true
    return_aux_details: false
  # Active model branch for this experiment.
  transformer_base_portfolio:
    d_model: 32
    # full: most complete O((lookback*stocks)^2), small universes only
    # axial: temporal + cross-stock attention O(S*L^2 + L*S^2)
    # latent: temporal + latent factors + market tokens, large universe friendly
    # latent_only: temporal + latent factors without market tokens
    # market_token: temporal + market tokens, smallest cross-stock transformer
    # temporal_only: no cross-stock attention
    attention_mode: market_token
    # Independent compact-bottleneck switches; null falls back to attention_mode.
    use_latent_factors: true
    use_market_tokens: true
    use_flash_attention: true
    use_time_pos: true
    use_symbol_pos: false
    # Keep the trainable symbol-position table at the original fold23 universe
    # size. Official TWSE/TPEx coverage may add symbols without expanding this
    # table; symbols beyond its capacity receive a neutral zero position vector
    # instead of sharing the last learned slot. With the direct 131 -> 32 Candle
    # Encoder, the fold20 model has 176,250 trainable parameters.
    symbol_position_capacity: 2330
    input_dropout: 0.0
    # build_panel guarantees finite feature storage. Keep position addition in
    # FP32 for numerical parity, and make the stable Blackwell attention
    # backend explicit; these switches do not change model parameters.
    sanitize_inputs: false
    amp_native_position_add: false
    temporal_self_attention_fast_path: false
    compiled_cross_attention_backend: manual
    # Fold18 full-TW benchmark: 65535 is the largest stable SDPA chunk in the
    # current CUDA/PyTorch environment. 65536 and 131071 both failed in SDPA
    # forward with CUDA invalid argument, so this is a kernel shape boundary,
    # not a VRAM limit.
    sdpa_batch_limit: 65535
    norm_type: rmsnorm
    ffn_type: swiglu
    qk_norm: true
    rope_temporal: true
    rope_base: 10000.0
    # Keep learned market tokens plus attention pooling/full_then_last. Fold18
    # two-epoch benchmark, using epoch 2 only: temporal_layers=1,
    # temporal_heads=1, temporal_ffn_mult=1, d_model=16, cross_heads=2, and
    # eval_model_chunk_rows=64 (originally selected by auto) reduced epoch wall
    # from 20.16s to 4.93s while
    # preserving attention pooling semantics. Adding train_symbol_compaction:
    # train_union then reduced epoch-2 wall to 3.72s and train time to
    # 175.1ms/batch on fold18 by training only the fold's active symbol union.
    # d_model=8 was faster at 3.35s but collapsed the 2-epoch fold18
    # validation/test loss, so it is only a lower bound probe, not active.
    temporal_layers: 2
    temporal_heads: 4
    temporal_ffn_mult: 4
    temporal_pooling: last
    temporal_query_mode: last_only
    cross_layers: 1
    cross_heads: 4
    cross_ffn_mult: 4
    joint_layers: 2
    joint_heads: 4
    joint_ffn_mult: 4
    latent_layers: 1
    num_latent_factors: 16
    num_market_tokens: 16
    market_layers: 1
    head_hidden_dim: 32
    head_layers: 1
    dropout: 0.0
    default_temperature: 1
    portfolio_mode: long_short
    # portfolio_output_mode design:
    # - activation_l1: legacy activated scores -> full-gross L1 weights; good baseline, dense.
    # - l1: raw centered scores -> full-gross L1 weights; strongest dense gradient among normalized modes.
    # - logits: raw centered logits; pair trading/loss portfolio_activation=identity so backtest/loss normalizes.
    # - signed_softmax: dense long/short/cash action simplex; legal cash, but weakest gradient for large S.
    # - signed_entmax15: sparse-ish long/short/cash action simplex; recommended when large-S softmax gradients are too small.
    # - signed_sparsemax: hardest sparse long/short/cash simplex; largest local gradients, more support-jump risk.
    # - projection_l1: raw holdings projected to L1 ball; legal cash, sparse only when raw gross exceeds 1.
    # For signed_* and projection_l1, keep portfolio_activation/loss_portfolio_activation=pre_normalized.
    portfolio_output_mode: projection_l1
    max_full_tokens: 16384
    checkpoint_blocks: false
    return_aux: false
    return_aux_details: false
    # Categorical features are embedded by name only when the feature is enabled above.
    categorical_feature_names:
      # - twpub_company_industry_code  # permanently disabled: snapshot-only
      # - twpub_company_is_foreign  # permanently disabled: snapshot-only
      # - twpub_company_has_preferred_stock  # permanently disabled: snapshot-only
    categorical_embedding_dim: 4
    categorical_embedding_cardinality: 512
    # return_aux_details returns attention/factor internals; keep false for training speed.
  # Gradient Boosted Portfolio Transformer.
  # To run this branch safely, use a fresh output_dir or set resume=false before
  # changing training.model_name to gradient_boosted_portfolio_transformer.
  gradient_boosted_portfolio_transformer:
    d_model: 32
    temporal_layers: 2
    temporal_heads: 4
    temporal_ffn_mult: 2
    market_layers: 1
    market_heads: 4
    market_ffn_mult: 2
    num_market_tokens: 4
    head_hidden_dim: 32
    head_layers: 1
    dropout: 0.0
    input_dropout: 0.0
    use_time_pos: true
    use_symbol_pos: false
    dynamic_market_tokens: true
    dynamic_token_gate_init: 0.1
    num_residual_stages: 2
    stage_eta: [0.5, 0.25]
    trainable_eta: true
    eta_max: 1.0
    detach_stage_condition: true
    default_temperature: 1.0
    portfolio_mode: long_short
    portfolio_output_mode: projection_l1
    center_final_logits: true
    return_aux: false
    return_aux_details: false
  bottleneck_portfolio_autoencoder:
    d_model: 64
    z_dim: 32
    temporal_type: tcn
    temporal_layers: 2
    asset_encoder_type: lite_isab
    asset_encoder_layers: 1
    n_heads: 4
    num_inducing_points: 32
    ffn_mult: 2
    dropout: 0.1
    long_short: true
    noise_std: 0.01
    return_aux: false
  tcn_hybrid_tabular_resnet:
    embedding_dim: 64
    encoder_hidden_dim: 128
    encoder_blocks: 2
    tcn_blocks: 2
    tcn_kernel_size: 3
    dropout: 0.3
  temporal_tabular_resnet:
    temporal_hidden_dim: 128
    temporal_layers: 1
    temporal_dropout: 0.3
    embedding_dim: 128
    hidden_dim: 256
    n_blocks: 4
    dropout: 0.1
  cross_sectional_temporal_portfolio_model:
    candidate_k: 64
    trade_k: 10
    scorer_hidden: 128
    scorer_blocks: 2
    d_model: 128
    heads: 4
    layers: 2
    dropout: 0.15
    regime_classes: 3
  multitask_loss:
    rank_ic_weight: 1.00
    direction_weight: 0.00
    volatility_regime_weight: 0.00
    concentration_weight: 0.00
    regime_up_threshold: 0.002
    regime_down_threshold: -0.002
  factor_generalization_loss:
    slope_tstat_weight: 1.0
    rank_ic_weight: 0.5
    factor_sharpe_weight: 0.25
    block_stability_weight: 0.20
    regime_stability_weight: 0.20
    consistency_weight: 0.05
    net_exposure_weight: 0.05
    gross_exposure_weight: 0.02
    concentration_weight: 0.02
    turnover_weight: 0.02
    score_l2_weight: 0.001
    factor_temperature: 1.0
    block_count: 4
    worst_fraction: 0.25
    augmentation_feature_dropout: 0.10
    augmentation_stock_dropout: 0.05
    augmentation_time_dropout: 0.05
    augmentation_noise_std: 0.01
  portfolio_autoencoder_loss:
    lambda_turnover: 0.1
    lambda_concentration: 0.01
    lambda_latent: 0.001
  lightgbm:
    use_gpu: true
    gpu_device_id: 0
    n_estimators: 300
    num_leaves: 63
    max_depth: -1
    learning_rate: 1
    subsample: 0.9
    colsample_bytree: 0.9
    reg_lambda: 1.0
    n_jobs: -1
    random_state: 42
  xgboost:
    use_gpu: true
    gpu_device_id: 0
    n_estimators: 300
    max_depth: 8
    learning_rate: 0.05
    subsample: 0.9
    colsample_bytree: 0.9
    reg_lambda: 1.0
    n_jobs: -1
    random_state: 42

evaluation:
  gamma_sharpe: 1.0
  gamma_excess: 1.0
  gamma_cvar: 1.0
  cvar_alpha: 0.95
  gamma_drawdown: 0.5
