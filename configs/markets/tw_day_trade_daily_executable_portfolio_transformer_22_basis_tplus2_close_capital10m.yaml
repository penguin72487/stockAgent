base_config: tw_day_trade_daily_multi_basis_22_effective_rank_projection_l1_no_time_attention_pooling_tplus2_close_capital10m.yaml

# Fresh causal/stateful contract. The policy sees only opening-time legal/fill
# permissions and prior-session reference-notional capacities. Same-session
# close masks, close price, and full-day volume are executor outcomes. A failed
# close becomes real financed/borrowed inventory; after the next overnight mark
# the OPEN transition trades target[t] minus the drifted carried position.
experiment_name: tw-day-trade-daily-executable-portfolio-transformer-22-basis-causal-stateful-carry-capital10m-v4

runner:
  output_dir: artifacts/markets/tw_day_trade_daily_executable_portfolio_transformer_22_basis_causal_stateful_carry_commission20_capital10m_v4
  # Contract 21 rebases long financing debt with every other recurrent ledger
  # component.  This root must not resume the invalid contract-20 v3 run.
  # Once created, resume is useful only for interruptions of this v4 run.
  resume: true
  post_train_infer: false

trading:
  long_only: false
  min_trade_weight: 0.0
  max_turnover_ratio: 0.0
  portfolio_activation: pre_normalized
  tw_day_trade_unlimited_margin_conversion: true
  # "Unlimited" removes only the quantity ceiling. Official opening short
  # eligibility, side masks, prior-volume participation, fees, financing
  # ratio, margin, T+2, and absorbing-default rules still apply.
  tw_short_capacity_limit_enabled: false

training:
  model_name: executable_portfolio_transformer
  # Full-universe dual-RTX-5090 benchmark winner: global 32 = 16 per rank.
  # Keep eval at 16; it already leaves enough headroom for the stateful ledger.
  batch_size_train: 32
  batch_size_eval: 16
  auto_batch_size: false
  loss_type: log_utility
  loss_portfolio_activation: pre_normalized
  # Preserve the complete per-epoch observability contract. Compute
  # optimization must not remove loss/test curves or defer their plots.
  record_epoch_curve: true
  curve_plot_interval: 1
  curve_test_interval: 1
  curve_plot_async: true
  epoch_test_curve: true
  defer_epoch_curve_plot_until_end: false

  executable_portfolio_transformer:
    portfolio_mode: long_short
    portfolio_output_mode: projection_l1
    center_long_short_logits: false
    projection_l1_scale_by_active_count: true
    execution_context_hidden_dim: 32
    execution_context_schema_version: 2
    temporal_basis_algebraic_contraction: true

  # No rank, direction, concentration, net-exposure, or regime preference is
  # imposed.  The only optimization target is canonical fee-adjusted net log
  # growth under the execution rules.
  multitask_loss:
    rank_ic_weight: 0.0
    return_rank_ic_weight: 0.0
    direction_weight: 0.0
    volatility_regime_weight: 0.0
    concentration_weight: 0.0
    net_exposure_weight: 0.0
