  volume_participation_equity: 100000000.0
  tw_futures_portfolio_minute_data_path: artifacts/data_preparation/all_futures_intraday_v8_20260927_v4/minutes.parquet

runner:
  output_dir: artifacts/markets/tw_futures_v8_intraday_capital100m_fold5
