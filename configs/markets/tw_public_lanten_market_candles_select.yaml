base_config: tw_public_lanten_market_candles_day_trade_snapshot_20260804.yaml

# Feature-selected continuation of the pinned-snapshot 99-feature day-trade
# experiment. Inheriting the source config keeps its long/short direction,
# causal open-at-entry, walk-forward, fee, and execution contracts unchanged.
experiment_name: tw-financial-transformer-candles-open-aware-select65-fold11-gross-tw-day-trade

runner:
  # A 65-feature model is checkpoint-incompatible with the source 99-feature
  # model, so training must start in a fresh artifact root.
  output_dir: artifacts/markets/tw_public_candles_tw_day_trade_select65_fold11
  resume: false

data:
  # Feature-screening contract (2026-08-05 UTC): folds 1-11 only, first calendar
  # year of each fold's test split, with complete Gradient x Input, Integrated
  # Gradients, perturbation, and surrogate-SHAP artifacts. The user-selected
  # cutoff is twpub_dividend_total_cash_log. Disable it and every currently
  # active feature whose 11-fold mean of the four normalized attribution shares
  # is lower. Result: keep 65/99 and disable 34/99.
  # Evidence: per-fold global_feature_attribution.csv under
  # artifacts/markets/tw_public_candles_tw_day_trade_lookback32/explainability/
  # fold_01_test through fold_11_test (fold_12 deliberately excluded).
  feature_include:
    # Base price log returns
    - open_logret_1d
    - max_logret_1d
    - min_logret_1d
    - close_logret_1d

    # The loader appends next_session_open_gap_logret because the inherited
    # day_trade_open_feature is true. It was non-zero in both attribution
    # methods and is therefore retained without exposing same-session close,
    # high, low, or full-day volume.

    # Base volume and signed volume
    - trading_volume_logret_1d
    - signed_vol

    # Base candlestick body, close location, and shadows
    - body_ratio
    - signed_body_ratio
    - delta_body_ratio
    - clv
    - clv_centered
    - delta_clv
    - upper_shadow
    - lower_shadow
    - shadow_imbalance

    # Official TWSE/TPEx daily price and liquidity
    - twpub_official_close_logret_1d
    - twpub_official_trading_volume_log
    - twpub_official_trading_value_log
    - twpub_official_trades_log
    - twpub_official_turnover_ratio
    - twpub_official_intraday_range
    - twpub_official_close_to_high
    - twpub_official_close_to_low

    # Valuation and dividend yield
    - twpub_pe_log
    - twpub_pb_log
    - twpub_dividend_yield
    - twpub_dividend_per_share_log

    # Margin financing and short balances/flows
    - twpub_margin_balance_log
    - twpub_margin_balance_chg
    - twpub_short_balance_log
    - twpub_short_balance_chg
    - twpub_margin_buy_flow
    - twpub_margin_sell_flow
    - twpub_short_sell_flow
    - twpub_short_buy_flow

    # Institutional trading flows
    - twpub_foreign_net_buy_flow
    - twpub_investment_trust_net_buy_flow
    - twpub_dealer_net_buy_flow
    - twpub_institutional_net_buy_flow

    # Snapshot-only feature families remain permanently disabled.
    # - twpub_tdcc_retail_holder_ratio  # permanently disabled: snapshot-only
    # - twpub_tdcc_large_holder_ratio  # permanently disabled: snapshot-only
    # - twpub_tdcc_holder_count_log  # permanently disabled: snapshot-only
    # - twpub_company_paidin_capital_log  # permanently disabled: snapshot-only
