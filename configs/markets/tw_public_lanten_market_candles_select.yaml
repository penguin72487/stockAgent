    # - twpub_dividend_stock_per_share  # disabled: 11-fold four-method mean share 0.00468%, below cutoff
    # - twpub_dividend_total_cash_log  # disabled: user-selected cutoff; 11-fold four-method mean share 0.02413%
    # - twpub_dividend_total_stock_log  # disabled: 11-fold four-method mean share 0.00897%, below cutoff
    # - twpub_dividend_confirmed  # disabled: 11-fold four-method mean share 0.00377%, below cutoff
    # - twpub_dividend_board_approved  # disabled: 11-fold four-method mean share 0.01413%, below cutoff
    # - twpub_exdiv_known  # disabled: exact zero in both methods across all 12 folds
