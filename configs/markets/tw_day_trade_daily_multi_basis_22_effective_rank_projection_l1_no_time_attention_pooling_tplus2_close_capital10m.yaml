base_config: tw_day_trade_daily_multi_basis_22_effective_rank_projection_l1_tplus2_close_capital10m.yaml

# Formal control used by the matching OFAT suite.  "no_time" disables only the
# learned temporal-position table; temporal RoPE remains enabled as an
# independent factor.  Attention pooling requires the full temporal query.
experiment_name: tw-day-trade-daily-multi-basis-22-effective-rank-projection-l1-no-time-attention-pooling-tplus2-close-commission20-capital10m-v1

runner:
  output_dir: artifacts/markets/tw_day_trade_daily_multi_basis_22_effective_rank_projection_l1_no_time_attention_pooling_tplus2_close_commission20_capital10m_v1
  resume: true
  post_train_infer: false

training:
  transformer_base_portfolio:
    use_time_pos: false
    temporal_pooling: attention
    temporal_query_mode: full_then_last
  financial_transformer:
    use_time_pos: false
    temporal_pooling: attention
    temporal_query_mode: full_then_last
