  feature_exclude: []
  # Compatibility guard: `feature_zero_fill` disables the full matched channel,
  # while retaining its model slot. This legacy baseline therefore does not use
  # any external values; use a fresh preprocessing contract/root to enable them.
  feature_zero_fill:
    - crypto_bybit_*
    - crypto_binance_*
    - crypto_okx_*
    - crypto_public_*

walk_forward:
  min_train_years: 1
  val_years: 1
  require_future_test_year: false
  expected_first_year: 2020
  require_contiguous_years: true
  lookback_context: panel_history
  split_start_year: null

trading:
  execution_mode: crypto_perpetual
  frequency: daily
  long_only: false
  # VIP0 taker fee, charged on each actually executed buy/sell notional.
  buy_fee_rate: 0.00055
  sell_fee_rate: 0.00055
  # No human turnover budget or forced rebalance rate.  The recurrent executor
  # derives its no-trade region from the exact applicable fee and the previous
  # executed holdings; the model learns the proposal, direction, gross, cash,
  # concentration, and persistence from canonical net log utility.
  crypto_stateful_proximal_allocator: true
  crypto_proximal_cost_multiplier: 1.0
  max_turnover_ratio: 0.0
  # Causal capacity uses the prior complete UTC day's official USDT turnover,
  # represented
  # as turnover / 00:05 execution price so the shared volume ledger recovers
  # the exact notional when it multiplies by execution price.
  max_volume_participation: 0.01
  volume_participation_equity: 1000000.0
  min_trade_weight: 0.0
  portfolio_activation: pre_normalized
  reporting_leverage: 1.0
  tw_day_trade_unlimited_margin_conversion: false

training:
  model_name: financial_transformer
  # Hard product contract: one daily target from the preceding 32 completed
  # daily sessions. Intraday source bars are aggregation inputs only.
  lookback: 32
  epochs: 1000
  loss_type: log_utility
  # The recurrent executor compiles one fixed four-day block and reuses it. An
  # outer compiled loss would unroll the whole horizon and repeat codegen.
  compile_loss: false
  loss_portfolio_activation: pre_normalized
  record_epoch_curve: true
  curve_plot_interval: 1
  curve_plot_async: true
  defer_epoch_curve_plot_until_end: false
  # Keep the shared encoder/head contract aligned even though Financial
  # Transformer is the active model. Crypto has no first-principles reason to
  # force net-zero exposure by de-meaning every cross section.
  transformer_base_portfolio:
    center_long_short_logits: false
    projection_l1_scale_by_active_count: true
  financial_transformer:
    # The inherited 18 fixed/learned causal bases are concatenated with the
    # ordinary lookback features before one shared RMSNorm/projection.
    temporal_basis_input: input_features
    center_long_short_logits: false
    portfolio_output_mode: projection_l1
    projection_l1_scale_by_active_count: true
    return_aux: false
    return_aux_details: false

evaluation:
  eval_log_utility_periods_per_year: 365.0
  # log_utility already consumes the fee/funding-adjusted canonical ledger.
  # Keep every human-shaped turnover target disabled; the cost-aware recurrent
  # allocator and actual fee determine whether a rebalance survives.
  gamma_turnover: 0.0
  turnover_budget: 0.0
  gamma_turnover_budget: 0.0
