# Bybit product adapter over the canonical completed TW multi-basis training
# standard.  Model/lifecycle/BF16/DDP/1000-epoch behavior is inherited; only
# crypto data, 24x7 execution, funding, fees, and public features differ.
base_config: tw_day_trade_daily_multi_basis_projection_l1_tplus2_close_capital10m.yaml

experiment_name: bybit-endogenous-usdt-perpetual-daily-multi-basis-projection-l1-public-web-v1

runner:
  output_dir: artifacts/markets/bybit_perpetual_daily_multi_basis_projection_l1_endogenous_policy_1w_v1
  resume: true
  post_train_infer: false

data:
  # Generated from complete local 1m grids. A date D row contains the complete
  # prior UTC calendar day through D 00:00; after a five-minute decision/order
  # lag, executor valuation uses the unseen D 00:05 1m Kline open.
  # Its adjclose embeds every official funding event in (D,D+1].
  parquet_root: data_bybit/perpetual_daily
  benchmark_name: BTCUSDT
  panel_start_date: "2020-03-27"
  security_filter: none
  usd_only_trading_pairs: false
  tradable_mode: tradable
  trading_volume_policy: required
  panel_backend: auto

  use_external_features: true
  external_feature_path: data_bybit/public_features/bybit_crypto_public_daily.parquet
  external_market_symbol: __MARKET__
  use_tw_public_features: false
  use_tw_public_rules: false
  day_trade_open_feature: false
  feature_shift_next_session: []
  allow_same_close_feature_approximation: false

