# Throughput-tuned dual-RTX-5090 variant of the canonical TX/MTX/TMF day
# strategy.  It changes hardware execution capacity only; the causal feature
# clock, model, loss, fees, integer audit, walk-forward folds, and reporting
# contract are inherited unchanged.
base_config: tw_index_futures_day.yaml

experiment_name: tw-stock-futures-joint-index-futures-day-dual-5090-100m-all-tenors-power2-v8

runner:
  # Batch shape differs from the canonical experiment, so keep checkpoints in
  # a fresh root rather than resuming a different optimizer trajectory.
  output_dir: artifacts/markets/tw_index_futures_day_joint_18_dual_5090_100m_exact_power2_v8
  isolate_train_folds: true

training:
  multi_gpu_strategy: distributed_data_parallel
  # Keep the global and per-rank tensor dimensions power-of-two: global 512 is
  # local 256/rank.  The measured non-power-of-two optimum (736) was faster,
  # but this experiment deliberately prefers regular kernel shapes.  Global
  # 768 already OOMed the real train hotpath, so 1024 is not a safe candidate.
  # Epochs, products, features, and data rows are semantic and stay exact.
  batch_size_train: 512
