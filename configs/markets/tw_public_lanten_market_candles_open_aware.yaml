base_config: tw_public_lanten_market_candles.yaml

# Open-aware day-trade experiment. The base carrying model now shares the same
# 99-feature causal current-open schema, but this distinct execution objective
# and action head still require their own checkpoint root.
experiment_name: tw-financial-transformer-candles-tw-day-trade-long-only-softmax-15_rebate

runner:
  # Lookback is part of the sample/checkpoint contract. Keep this root separate
  # from the older lookback-128 day-trade experiment.
  output_dir: artifacts/markets/tw_public_candles_tw_day_trade_lookback32_long_only_softmax_panel_history_v2
  resume: false

data:
  # Adds next_session_open_gap_logret.  On the model window's final t-1 row it
  # equals log(open[t] / close[t-1]); no session-t high/low/close/volume enters
  # the feature tensor.
  day_trade_open_feature: true
  panel_start_date: "2014-01-01"

walk_forward:
  expected_first_year: 2014
  split_start_year: null
  lookback_context: panel_history

trading:
  execution_mode: tw_day_trade
  # Buy at the open and sell the owned position at the close. Disable the
  # sell-first/cover-at-close branch throughout model, loss, and execution.
  long_only: true

training:
  financial_transformer:
    # The base Transformer block is long/short, and Financial Transformer
    # inherits it before applying this child override.
    portfolio_mode: long_only
    # Identity-L1 clips negative logits to zero in long-only mode. Once every
    # logit becomes negative, both positions and gradients are permanently
    # zero. Softmax over long actions plus an explicit cash action stays
    # differentiable while preserving non-negative holdings and optional cash.
    portfolio_output_mode: signed_softmax
  # Every validation/test split owns its first target and may read earlier,
  # already-observed rows for the causal feature window.
  lookback: 32
