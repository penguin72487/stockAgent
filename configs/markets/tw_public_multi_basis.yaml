base_config: tw_public_lanten_market_candles.yaml

experiment_name: tw-public-financial-transformer-multi-basis-lookback32-v1

runner:
  # The multi-basis branch changes model parameters and optimizer semantics.
  # Keep it in a fresh artifact root instead of resuming the raw-only baseline.
  output_dir: artifacts/markets/tw_public_candles_multi_basis_lookback32_v1
  resume: false

training:
  model_name: financial_transformer
  lookback: 32
  transformer_base_portfolio:
    # Raw time-domain and the learned temporal Transformer remain enabled by
    # construction. The existing latent/market-token path owns cross-stock
    # learned eigenfactors. These fixed non-DC banks add only complementary
    # within-stock temporal inductive biases.
    temporal_basis_families: [haar, fourier, dct]
    temporal_basis_components: 8
    temporal_basis_dropout: 0.0
    # sigmoid(-2) ~= 0.119: start as a conservative residual, then let the
    # optimizer decide per stock/window how much basis information to admit.
    temporal_basis_gate_init: -2.0
