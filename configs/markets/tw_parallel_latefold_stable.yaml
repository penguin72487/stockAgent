base_config: tw_parallel.yaml

experiment_name: tw-stock-transformer-market-public-data-epyc7662-dual5090-latefold-stable

runner:
  output_dir: artifacts/markets/tw_parallel_latefold_stable
  mode: train
  resume: true
  post_train_infer: false
  start_fold: 24

environment:
  amp_dtype: bf16
  torch_compile_threads: 64

trading:
  long_only: false
  min_trade_weight: 0.0
  portfolio_activation: identity
  max_turnover_ratio: 0.0

training:
  model_name: transformer_base_portfolio
  multi_gpu_strategy: distributed_data_parallel
  data_parallel_device_ids: [0, 1]
  ddp_bucket_cap_mb: 16
  enable_torch_compile: true
  auto_torch_compile_sharpe: false
  torch_compile_mode: default
  compile_loss: true
  compile_fused_log_utility_loss: false
  fused_log_utility_loss: true
  fused_log_utility_manual_backward: true
  loss_portfolio_activation: identity

  # Objective sweep knob:
  # - log_utility: fastest DDP fused path, default for late-fold stabilization.
  # - sharpe or sharpck: canonical DDP all-gather return-series loss.
  # - sortino: canonical DDP all-gather downside-risk loss.
  loss_type: log_utility

  batch_size: 128
  batch_size_train: 128
  batch_size_eval: 256
  epochs: 240
  early_stopping_no_improve_ratio: 0.08

  learning_rate: 0.0001
  enable_lr_scheduler: true
  lr_scheduler: plateau
  lr_scheduler_interval: epoch
  lr_scheduler_gamma: 0.5
  lr_scheduler_patience: 3
  lr_scheduler_threshold: 0.0005
  lr_scheduler_eta_min: 0.000005

  weight_decay: 0.03
  grad_clip_norm: 0.75
  finite_check_interval_steps: 50

  multitask_loss:
    rank_ic_weight: 0.30
    return_rank_ic_weight: 0.03
    direction_weight: 0.00
    volatility_regime_weight: 0.00
    concentration_weight: 0.02
    regime_up_threshold: 0.002
    regime_down_threshold: -0.002

  transformer_base_portfolio:
    attention_mode: market_token
    temporal_pooling: attention
    temporal_query_mode: full_then_last
    qk_norm: true
    input_dropout: 0.05
    dynamic_latent_tokens: false
    dynamic_market_tokens: false
    dynamic_token_dropout: 0.05
    dropout: 0.10
    portfolio_mode: long_short
    portfolio_output_mode: logits
    return_aux: false
    return_aux_details: false

evaluation:
  gamma_turnover: 0.05
  turnover_budget: 0.25
  gamma_turnover_budget: 0.5
