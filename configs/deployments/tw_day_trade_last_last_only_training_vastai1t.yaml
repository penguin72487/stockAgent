# Active v7 successor to the immutable learned-cash v6 control.
#
# The legacy projection-L1 output is retired from this training project: with
# O(1) logits over S stocks its pre-projection gross grows as O(S), pinning
# almost every row to gross=1. The learned_cash contract instead separates a
# normalized signed stock direction from an independent contextual cash gate.
# The model therefore owns long, short, net, gross and cash; execution merely
# applies legal masks, whole lots and 50% capacity.
#
# V7 changes exactly one execution assumption: the final 13:30 liquidation is
# reduction-only and fills every remaining deliverable share at the official
# close without a volume-capacity ceiling. Entry and the earlier 13:20/13:24
# path retain the same 50% minute capacity. This assumption is part of the
# exact loss/backtest/checkpoint contract and is not an observed-liquidity
# claim. All 99 point-in-time features, lookback/gradient horizon 32, TWD 10M,
# fees/tax, learned cash, 22-family basis map and 0.1 early-stop ratio remain.
base_config: tw_day_trade_last_last_only_training_vastai1t_v6.yaml

experiment_name: tw-day-trade-last-last-only-terminal-unlimited-v7

runner:
  # Executed quantities and the exact loss changed. Never resume v6 optimizer
  # state or write into its artifact root.
  output_dir: /root/stockAgent/artifacts/markets/tw_day_trade_last_last_only_layernorm_minute50_terminal_unlimited_capital10m_batch32_learned_cash_22_effective_rank_v7
  resume: true

trading:
  tw_day_trade_terminal_liquidation_unlimited_capacity: true

training:
  # Preserve the user's original stopping design.
  early_stopping_no_improve_ratio: 0.1
