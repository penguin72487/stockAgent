# Full corrected walk-forward run. Each target fold starts at its first owned
# trading session, while 2014 remains causal panel history. The pretrained
# source may contain only earlier prefix training years and must have the exact
# same validation years; optimizer state and source test metrics are never
# imported. This maps corrected folds 1--10 to causal source folds 2--11.
base_config: tw_day_trade_v8_combined_annual_log_cash_sub_lot_first_session_fold10_v4.yaml
experiment_name: tw-day-trade-v8-combined-annual-log-cash-sub-lot-first-session-all-folds-v5

runner:
  output_dir: artifacts/markets/tw_day_trade_v8_combined_annual_log_cash_sub_lot_first_session_all_folds_v5
  start_fold: 1
  resume: true

training:
  pretrained_initialization_fold_policy: matching_validation_and_causal_train_superset
