# Exact physical-FIFO throughput candidate for the canonical dual-RTX-5090
# benchmark.  It keeps dense minute events and every accounting rule unchanged,
# but compiles each session at the smallest exact cohort capacity required by
# that session instead of the maximum capacity seen anywhere in the batch.
base_config: tw_day_trade_last_last_only_training_vastai1t_v4.yaml

runner:
  output_dir: /root/stockAgent/artifacts/markets/tw_day_trade_last_last_only_layernorm_minute50_margin_carry_capital10m_batch32_share_replacement_v5_cohort_only_candidate

training:
  # Benchmark-only override so a short five-epoch run cannot stop before its
  # zero-new-graph steady-state samples.  The formal 1000-epoch policy remains
  # inherited when this candidate is promoted.
  early_stopping_no_improve_ratio: 1.0
  day_trade_cohort_bucket_mode: session_minimum
  day_trade_prepared_batch_cache_gb: 0.0
  day_trade_source_decode_workers: 4
  day_trade_prefetch_depth: 2
  day_trade_sparse_events: false
