# Follow-up to the completed v1 and interrupted/finalized v2 Fold-11 runs.
# It preserves the validated data, annual exact-account episodes, sub-lot
# recovery, 1,000-epoch lifecycle, fees, execution clock and TWD 10M account.
# Only the parameter-free stock-to-cash output geometry changes: log1p score
# evidence gives an unbounded but sublinear selector between raw and bounded
# entmax concentration.
base_config: tw_day_trade_v8_combined_annual_output_v2_sub_lot_fold11_v1.yaml
experiment_name: tw-day-trade-v8-combined-annual-log-cash-sub-lot-fold11-v3

runner:
  output_dir: artifacts/markets/tw_day_trade_v8_combined_annual_log_cash_sub_lot_fold11_v3
  start_fold: 11
  resume: true
  post_train_infer: false

training:
  financial_transformer:
    portfolio_output_mode: score_entmax_log_cash
    center_long_short_logits: false
