# Admit only against its resident-source binding and complete-fold evidence.
# Execution tuning preserves all selected features, d_model and lookback.
contract: frontier_complete_fold_recipes_v1
full_fold_candidates:
  - name: vastai1t_resident_full_schema_csr_v2
    kernel_environment: true
    # The original 256 case failed the 1.5 GiB VRAM headroom gate.
    batch_size: 128
    fold: 11
    cpu_threads: 8
    compile_threads: 16
    epochs: 4
    overrides:
      training:
        batch_size_train: 128
        financial_transformer:
          compiled_cross_attention_backend: manual
          temporal_blocks_fp32: false
          kernel_softmax_backend: quack
          factorized_sparse_projection: true
          factorized_sparse_cache_bytes: 21474836480
        day_trade_annual_episode_sharding: true
        day_trade_annual_episode_world_size: 2
        ddp_broadcast_buffers: false
        ddp_trajectory_gradient_sync: trajectory
    runtime_overrides:
      STOCKAGENT_DDP_CPU_AFFINITY: '42-55,154-167;28-41,140-153'
      STOCKAGENT_DAY_TRADE_PREPARE_COMPILE: 1
      STOCKAGENT_DAY_TRADE_CALENDAR_CACHE: 1
      STOCKAGENT_DAY_TRADE_FINALIZE_COMPILE: 1
